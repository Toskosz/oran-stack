# Example PackageVariant manifests for deploying oran-stack blueprints
# into the oran-lab workload deployment repository via Porch.
#
# Apply on the MANAGEMENT cluster after blueprints and oran-lab repos
# are registered with Porch. Approve PackageRevisions in dependency order:
#
#   ns-and-secrets → 5g-core → mongodb-init → near-rt-ric → ran →
#   verify-e2 → xapp-simple-mon → xapp-lifecycle → verify-ue → monitoring
#
# Automated deployment:
#
#   ansible-playbook ansible/playbooks/deploy-nephio-nfs.yml
#
# See docs/NEPHIO.md §4 for lifecycle details and manual commands.
#
# Adjust repository names / package paths to match your Porch registration.
# Use workspaceName (branch) for unpublished drafts, or revision: <int> for published vN tags.
# Porch forbids '/' in branch/workspace names (K8s resource name constraint).
apiVersion: config.porch.kpt.dev/v1alpha1
kind: PackageVariant
metadata:
  name: oran-lab-ns-and-secrets
  namespace: default
spec:
  upstream:
    repo: blueprints
    package: ns-and-secrets
    workspaceName: refactor-nephio
  downstream:
    repo: oran-lab
    package: ns-and-secrets
  adoptionPolicy: adoptExisting
  deletionPolicy: delete
---
apiVersion: config.porch.kpt.dev/v1alpha1
