  namespace: 5g-core
  labels:
    app: mongodb
    app.kubernetes.io/part-of: oran-stack
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
  - name: mongo
    port: 27017
    targetPort: 27017
