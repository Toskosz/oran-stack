# Internal SBI service (HTTP/2) — used by other NFs to reach AMF.
apiVersion: v1
kind: Service
metadata:
  name: amf
  namespace: 5g-core
  labels:
    app: amf
spec:
  selector:
    app: amf
  ports:
  - name: sbi
    port: 7777
    targetPort: 7777
  - name: metrics
    port: 9090
    targetPort: 9090
---
