metadata:
  name: amf-ngap
  namespace: 5g-core
  labels:
    app: amf
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: amf
  ports:
  - name: ngap
    port: 38412
    targetPort: 38412
    protocol: SCTP
