# Source: 5g-core/templates/deployment-amf.yaml
# ============================================================================
# AMF — Access and Mobility Management Function
# ============================================================================
# Two Services:
#   1. amf       (ClusterIP)  — SBI HTTP/2 on port 7777, internal only
#   2. amf-ngap  (NodePort)   — SCTP N2/NGAP on port 38412, for real gNBs
#                               outside the cluster.
#
# N2/NGAP for the in-cluster ocudu-cu uses the secondary OVS interface
# (n2br-net NAD). The CU connects to .Values.secondaryNetworks.n2.amfIP
# directly over the dedicated L2 OVS bridge, bypassing Flannel entirely.
# This eliminates the SCTP conntrack corruption that occurred with Calico
# VXLAN overlay — no headless service workaround is needed.
#
# The SCTP kernel module must be loaded first — see daemonset-sctp-init.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amf
  namespace: 5g-core
  labels:
    app: amf
    app.kubernetes.io/part-of: oran-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: amf
  template:
    metadata:
      labels:
        app: amf
      annotations:
        # Attach a secondary interface on the n2br OVS bridge with a static IP.
        # The CU connects to this IP directly over L2 for N2/NGAP SCTP.
        k8s.v1.cni.cncf.io/networks: '[{"name":"n2br-net","ips":["10.200.1.2"]}]'
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: amf
        image: x0tok/oran-5gcore:latest
        imagePullPolicy: IfNotPresent
        command: ["/entrypoint.sh", "./install/bin/open5gs-amfd", "-c", "/open5gs/install/etc/open5gs/amf.yaml"]
        workingDir: /open5gs
        env:
        - name: SKIP_MONGODB
          value: "true"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/open5gs"
        - name: MCC
          value: "001"
        - name: MNC
          value: "01"
        - name: TAC
          value: "1"
        - name: AMF_REGION
          value: "2"
        - name: AMF_SET
          value: "1"
        - name: AMF_SBI_PORT
          value: "7777"
        - name: AMF_NGAP_PORT
          value: "38412"
        - name: AMF_METRICS_PORT
          value: "9090"
        - name: NRF_IP
          value: "nrf"
        - name: NRF_SBI_PORT
          value: "7777"
        - name: SCP_IP
          value: "scp"
        - name: SCP_SBI_PORT
          value: "7777"
        - name: SEPP_IP
