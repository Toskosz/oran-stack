# Source: 5g-core/templates/statefulset-mongodb.yaml
# ============================================================================
# MongoDB StatefulSet + Service
# ============================================================================
# StatefulSet gives MongoDB:
#   - A stable DNS name: mongodb.5g-core.svc.cluster.local
#   - A stable PersistentVolumeClaim that survives pod restarts
#   - Ordered, one-at-a-time startup (important for replica set init)
#
# The replica set (rs0) has a single member for this lab deployment.
# MONGODB_URI in all NFs is set to mongodb://mongodb:27017/open5gs, which
# resolves to the headless ClusterIP Service below.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: 5g-core
  labels:
    app: mongodb
    app.kubernetes.io/part-of: oran-stack
spec:
  serviceName: mongodb # Must match the headless Service name below.
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: mongodb
        image: mongo:7.0
        # Use args (not command) so the official entrypoint runs init scripts
        # in /docker-entrypoint-initdb.d/ on first startup with an empty PVC.
        # deploy_5g_core also runs rs.initiate + seed idempotently after deploy.
        args: ["--replSet", "rs0", "--bind_ip_all"]
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_DATABASE
          value: open5gs
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: mongodb-config
          mountPath: /data/configdb
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
      volumes:
      - name: init-scripts
        configMap:
          name: mongodb-init-scripts
  # VolumeClaimTemplates create a PersistentVolumeClaim per replica.
  # GKE's standard-rwo StorageClass provisions a GCP Persistent Disk (pd-ssd)
  # automatically when the pod is first scheduled.
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 20Gi
  - metadata:
      name: mongodb-config
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 1Gi
