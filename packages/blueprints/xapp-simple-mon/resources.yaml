apiVersion: v1
kind: Service
metadata:
  name: service-ricxapp-r4-simple-mon-rmr
  namespace: ricxapp
  labels:
    app: r4-simple-mon
spec:
  publishNotReadyAddresses: true
  selector:
    app: r4-simple-mon
    release: r4-simple-mon
  ports:
  - name: rmr
    port: 4561
    targetPort: 4561
    protocol: TCP
  - name: http
    port: 8091
    targetPort: 8091
    protocol: TCP
---
