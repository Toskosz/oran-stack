# --- rtmgr configuration -----------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: rtmgr-config
  namespace: near-rt-ric
  labels:
    app.kubernetes.io/part-of: oran-stack
data:
  rtmgr-config.yaml: |
    PlatformComponents:
      - name: E2TERM
        fqdn: ric-e2term
        port: 38000
      - name: SUBMAN
        fqdn: ric-submgr
        port: 4560
      - name: E2MAN
        fqdn: ric-e2mgr
        port: 3801
    PlatformRoutes:
      - messagetype: E2_TERM_INIT
        senderendpoint: ""
        subscriptionid: -1
        endpoint: E2MAN
        meid: ""
      - messagetype: E2_TERM_KEEP_ALIVE_RESP
        senderendpoint: ""
        subscriptionid: -1
        endpoint: E2MAN
        meid: ""
      - messagetype: RIC_SCTP_CONNECTION_FAILURE
        senderendpoint: ""
        subscriptionid: -1
        endpoint: E2MAN
        meid: ""
      - messagetype: RIC_SCTP_CLEAR_ALL
        senderendpoint: ""
        subscriptionid: -1
        endpoint: E2MAN
        meid: ""
      - messagetype: RIC_E2_SETUP_REQ
        senderendpoint: ""
        subscriptionid: -1
        endpoint: E2MAN
        meid: ""
      - messagetype: RIC_E2_RESET_REQ
        senderendpoint: ""
        subscriptionid: -1
        endpoint: E2MAN
        meid: ""
      - messagetype: RIC_SERVICE_UPDATE
        senderendpoint: ""
        subscriptionid: -1
        endpoint: E2MAN
        meid: ""
      - messagetype: RIC_SUB_REQ
        senderendpoint: SUBMAN
        subscriptionid: -1
        endpoint: ""
        meid: "%meid"
      - messagetype: RIC_SUB_RESP
        senderendpoint: ""
        subscriptionid: -1
        endpoint: SUBMAN
        meid: ""
      - messagetype: RIC_SUB_FAILURE
        senderendpoint: ""
        subscriptionid: -1
        endpoint: SUBMAN
        meid: ""
      - messagetype: RIC_SUB_DEL_REQ
        senderendpoint: SUBMAN
        subscriptionid: -1
        endpoint: ""
        meid: "%meid"
      - messagetype: RIC_SUB_DEL_RESP
        senderendpoint: ""
        subscriptionid: -1
        endpoint: SUBMAN
        meid: ""
      - messagetype: RIC_SUB_DEL_FAILURE
        senderendpoint: ""
        subscriptionid: -1
        endpoint: SUBMAN
        meid: ""
      - messagetype: RIC_SUB_DEL_REQUIRED
        senderendpoint: E2MAN
        subscriptionid: -1
        endpoint: SUBMAN
        meid: ""
    messagetypes:
      - "E2_TERM_INIT=1100"
      - "E2_TERM_KEEP_ALIVE_REQ=1101"
      - "E2_TERM_KEEP_ALIVE_RESP=1102"
      - "RIC_SCTP_CONNECTION_FAILURE=1080"
      - "RIC_SCTP_CLEAR_ALL=1090"
      - "RAN_CONNECTED=1200"
      - "RAN_RESTARTED=1210"
      - "RAN_RECONFIGURED=1220"
      - "RIC_E2_SETUP_REQ=12001"
      - "RIC_E2_SETUP_RESP=12002"
      - "RIC_E2_SETUP_FAILURE=12003"
      - "RIC_E2_RESET_REQ=12004"
      - "RIC_E2_RESET_RESP=12005"
      - "RIC_E2_RAN_ERROR_INDICATION=12006"
      - "RIC_SUB_REQ=12010"
      - "RIC_SUB_RESP=12011"
      - "RIC_SUB_FAILURE=12012"
      - "RIC_SUB_DEL_REQ=12020"
      - "RIC_SUB_DEL_RESP=12021"
      - "RIC_SUB_DEL_FAILURE=12022"
      - "RIC_SUB_DEL_REQUIRED=12023"
      - "RIC_SERVICE_UPDATE=12030"
      - "RIC_SERVICE_UPDATE_ACK=12031"
      - "RIC_SERVICE_UPDATE_FAILURE=12032"
      - "RIC_CONTROL_REQ=12040"
      - "RIC_CONTROL_ACK=12041"
      - "RIC_CONTROL_FAILURE=12042"
      - "RIC_INDICATION=12050"
      - "RIC_SERVICE_QUERY=12060"
      - "RIC_E2NODE_CONFIG_UPDATE=12070"
      - "RIC_E2NODE_CONFIG_UPDATE_ACK=12071"
      - "RIC_E2NODE_CONFIG_UPDATE_FAILURE=12072"
      - "RIC_HEALTH_CHECK_REQ=100"
      - "RIC_HEALTH_CHECK_RESP=101"
    # A1_POLICY_* deliberately omitted: referencing them makes rtmgr look up
    # Platform component "A1Mediator". When that lookup fails (or A1's RMR
    # wormhole is down), rtmgr redistributes a full newrt every few seconds
    # and wipes subscription indication routes (mse|12050|<subid>|...).
    local:
      host: ":8989"
    logger:
      level: 4
    rmr:
      protPort: "tcp:4560"
      maxSize: 2072
      numWorkers: 1
    rtfile: "/db/rt.json"
    cfgfile: "/cfg/rtmgr-config.yaml"
    nbiurl: "http://ric-e2mgr:3800"
    nbi: "httpRESTful"
    sbi: "rmrpush"
    rpe: "rmrpush"
    sdl: "file"
    xmurl: "http://ric-appmgr:8080/ric/v1/xapps"
    e2murl: "http://ric-e2mgr:3800/v1/e2t/list"
    subscription:
      host: "ric-submgr"
      port: 8088
      timeout: 30
  rt.json: |
    {"XApps":[],"E2Ts":{},"MeidMap":[],"Pcs":[{"name":"E2TERM","fqdn":"ric-e2term","port":38000},{"name":"SUBMAN","fqdn":"ric-submgr","port":4560},{"name":"E2MAN","fqdn":"ric-e2mgr","port":3801}]}
