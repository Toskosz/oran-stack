# Source: near-rt-ric/templates/deployments.yaml
# Internal RMR service for e2term — used by other RIC components.
# Headless (clusterIP: None) so DNS returns the pod IP directly. RMR cannot
# reliably open connections via kube-proxy ClusterIP (open=0 succ=0 to
# ric-e2term:38000) while pod-IP targets work. Seed routes use the service
# name; headless makes that name resolve to the Flannel pod IP.
apiVersion: v1
kind: Service
metadata:
  name: ric-e2term
  namespace: near-rt-ric
  labels:
    app: ric-e2term
spec:
  clusterIP: None
  selector:
    app: ric-e2term
  ports:
  - name: rmr
    port: 38000
    targetPort: 38000
  - name: metrics
    port: 8088
    targetPort: 8088
  - name: rmr-mgmt
    port: 4561
    targetPort: 4561
---
# Source: near-rt-ric/templates/deployments.yaml
# External SCTP service for E2 interface — DU connects here.
# Named 'e2term' (without 'ric-' prefix) to match .Values.e2termAddress
# in the ran chart: "e2term.near-rt-ric.svc.cluster.local"
# NOTE: GCP external load balancers do not support SCTP forwarding rules.
# NodePort is used instead; an external DU must target a node IP:nodePort.
# For in-cluster DU pods, the ClusterIP DNS name works directly.
apiVersion: v1
kind: Service
metadata:
  name: e2term
  namespace: near-rt-ric
  labels:
    app: ric-e2term
spec:
  type: NodePort
  selector:
    app: ric-e2term
  ports:
  - name: e2-sctp
    port: 36421
    targetPort: 36421
    protocol: SCTP
