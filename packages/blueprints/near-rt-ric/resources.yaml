# Source: near-rt-ric/templates/deployments.yaml
# --- RTMGR (Routing Manager) -------------------------------------------------
# hostAliases replaces the extra_hosts hack from docker-compose.ric.yml.
# rtmgr hardcodes the submgr URL as
#   "service-ricplt-submgr-http.ricplt:<port>"
# which doesn't resolve in Kubernetes. hostAliases injects that name into
# the pod's /etc/hosts pointing at the ric-submgr ClusterIP.
#
# lookup() resolves the ClusterIP at Helm render time. On first install the
# Service doesn't exist yet, so lookup returns ""; the initContainer then
# writes the resolved IP into /shared/submgr-ip, which is used by a
# post-start lifecycle hook — but a simpler approach is to template the IP
# directly via lookup with a fallback to the in-cluster DNS resolution done
# by the wait-for-submgr initContainer writing to /etc/hosts via nsenter.
# Instead: use the DNS name that WILL exist once the chart installs, resolved
# at pod start by the initContainer, written into a shared volume, and
# injected via a custom entrypoint that patches /etc/hosts before exec'ing rtmgr.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ric-rtmgr
  namespace: near-rt-ric
  labels:
    app: ric-rtmgr
    app.kubernetes.io/part-of: oran-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ric-rtmgr
  template:
    metadata:
      labels:
        app: ric-rtmgr
    spec:
      hostAliases:
      # rtmgr internally dials "rtmgr:4560" for its self-wormhole.
      # Without this alias, DNS fails and rtmgr cannot build any routes.
      - ip: "127.0.0.1"
        hostnames:
        - rtmgr
        - routingmanager
      initContainers:
      - name: wait-for-e2mgr
        image: alpine:3.19
        command: ["sh", "-c", "until wget -qO- http://ric-e2mgr:3800/v1/health; do echo waiting for e2mgr; sleep 3; done"]
      # Resolve the ric-submgr ClusterIP and write it to a shared volume.
      # The main container's command patches /etc/hosts before starting rtmgr,
      # injecting the alias that rtmgr hardcodes internally.
      - name: resolve-submgr-ip
        image: alpine:3.19
        command:
        - sh
        - -c
        - |
          until getent hosts ric-submgr > /tmp/out; do
            echo "waiting for ric-submgr DNS..."; sleep 2;
          done
          awk '{print $1}' /tmp/out > /shared/submgr-ip
          echo "Resolved ric-submgr to: $(cat /shared/submgr-ip)"
        volumeMounts:
        - name: shared
          mountPath: /shared
      containers:
      - name: rtmgr
        image: nexus3.o-ran-sc.org:10001/o-ran-sc/ric-plt-rtmgr:0.9.6
        imagePullPolicy: IfNotPresent
        # Patch /etc/hosts with the submgr alias before exec'ing the real binary.
        # This is the Kubernetes equivalent of Docker Compose extra_hosts.
        command:
        - sh
        - -c
        - |
          SUBMGR_IP=$(cat /shared/submgr-ip)
          echo "${SUBMGR_IP}  service-ricplt-submgr-http.ricplt" >> /etc/hosts
          exec /run_rtmgr.sh
        env:
        - name: RMR_SEED_RT
          value: /uta_rtg_ric.rt
        - name: RMR_RTG_SVC
          value: ric-rtmgr:4561
        # Without RMR_SRC_ID, RMR defaults to $HOSTNAME (pod name).
        # e2term/e2mgr then try to resolve the pod name to ACK route
        # updates, which fails. Force the stable service name instead.
        - name: RMR_SRC_ID
          value: ric-rtmgr.near-rt-ric
        - name: CFGFILE
          value: /cfg/rtmgr-config.yaml
        - name: RTFILE
          value: /db/rt.json
        - name: DBAAS_SERVICE_HOST
          value: ric-dbaas
        - name: DBAAS_SERVICE_PORT
          value: "6379"
        ports:
        - containerPort: 3800
          name: http
        - containerPort: 4560
          name: rmr
        volumeMounts:
        - name: rtmgr-config
          mountPath: /cfg/rtmgr-config.yaml
          subPath: rtmgr-config.yaml
        # /db/rt.json must be writable — rtmgr writes the computed route
        # table here at runtime. Mount an emptyDir so the ConfigMap seed
        # (read-only subPath) does not block writes.
        - name: rtmgr-db
          mountPath: /db
        - name: shared
          mountPath: /shared
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: rtmgr-config
        configMap:
          name: rtmgr-config
      - name: rtmgr-db
        emptyDir: {}
      - name: shared
        emptyDir: {}
---
# Source: near-rt-ric/templates/deployments.yaml
# --- E2TERM (E2 Termination) --------------------------------------------------
# Two Services:
#   1. ric-e2term (ClusterIP) — RMR ports for internal RIC communication
#   2. e2term (LoadBalancer, SCTP) — external E2 endpoint for the DU
#
# The initContainer sleep implements the documented 5-second startup delay.
# RIC_E2TERM_SERVICE_HOST uses the Downward API to get the pod's own IP,
# replacing the hardcoded 172.22.0.210 from docker-compose.ric.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ric-e2term
  namespace: near-rt-ric
  labels:
    app: ric-e2term
    app.kubernetes.io/part-of: oran-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ric-e2term
  template:
    metadata:
      labels:
        app: ric-e2term
      annotations:
        # Multus secondary network: E2 interface on dedicated OVS bridge.
        # Static IP eliminates SCTP conntrack/VXLAN flapping over Flannel.
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "e2br-net",
              "namespace": "near-rt-ric",
              "ips": ["10.200.3.4/24"]
            }
          ]
    spec:
      serviceAccountName: ric-e2term
      initContainers:
      - name: wait-for-e2mgr
        image: alpine:3.19
        command: ["sh", "-c", "until wget -qO- http://ric-e2mgr:3800/v1/health; do echo waiting for e2mgr; sleep 3; done"]
      # render-config: copy the read-only ConfigMap into an emptyDir so we can
      # substitute runtime values. Doing it here (not just in startup.sh's sed)
      # is robust and makes the rendered config visible in initContainer logs.
      #
      # Substitutions:
      #   local-ip=POD_IP_PLACEHOLDER → primary pod IP (Downward API status.podIP)
      #       This is the E2T/RMR endpoint e2mgr must reach. It MUST be the
      #       Flannel eth0 IP, never the OVS secondary IP (e2mgr has no route
      #       to the OVS bridge). SCTP E2AP still binds 0.0.0.0:36421.
      #   external-fqdn=e2t.com       → ric-e2term (stable K8s service name)
      #   pod_name=E2TERM_POD_NAME    → left as-is (env var pointer; e2term reads
      #                                 the env var named by this field at runtime)
      - name: render-config
        image: busybox:1.36
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        command:
        - sh
        - -c
        - |
          cp /config-ro/config.conf /config-rw/config.conf
          cp /config-ro/dockerRouter.txt /config-rw/dockerRouter.txt
          # E2T/RMR endpoint must be the primary (Flannel) pod IP so e2mgr
          # can reach it for keepalive and E2SetupResponse routing.
          sed -i "s|local-ip=.*|local-ip=${POD_IP}|" /config-rw/config.conf
          # external-fqdn: stable K8s service name (default 'e2t.com' is
          # not resolvable in-cluster).
          sed -i "s|external-fqdn=.*|external-fqdn=ric-e2term|" /config-rw/config.conf
          # pod_name is an ENV VAR POINTER, not a literal — keep as-is and
          # set E2TERM_POD_NAME via Downward API on the main container.
          echo "Rendered e2term config.conf:"
          cat /config-rw/config.conf
        volumeMounts:
        - name: e2term-config-ro
          mountPath: /config-ro
        - name: e2term-config-rw
          mountPath: /config-rw
      # This sleep (30s) ensures e2mgr's RMR
      # outbound connection to e2term is established before e2term opens the
      # SCTP port. Without it, the first E2_TERM_KEEP_ALIVE_RESP can fail with
      # RMR_ERR_NOENDPT and trigger the keep-alive death spiral.
      # See docs/LEARNINGS.md for the full diagnosis.
      - name: startup-delay
        image: busybox:1.36
        command: ["sleep", "30"]
      containers:
      - name: e2term
        image: nexus3.o-ran-sc.org:10001/o-ran-sc/ric-plt-e2:6.0.8
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "./startup.sh"]
        securityContext:
          privileged: true
        env:
        - name: RMR_SEED_RT
          value: /opt/e2/config/dockerRouter.txt
        - name: RMR_RTG_SVC
          value: ric-rtmgr:4561
        - name: RMR_SRC_ID
          value: ric-e2term
        - name: E2TERM_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: LD_LIBRARY_PATH
          value: /usr/local/lib
        - name: DBAAS_SERVICE_HOST
          value: ric-dbaas
        - name: DBAAS_SERVICE_PORT
          value: "6379"
        ports:
        - containerPort: 38000
          name: rmr
        - containerPort: 36421
          name: e2-sctp
          protocol: SCTP
        - containerPort: 8088
          name: metrics
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8088
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 6
        volumeMounts:
        # Use the writable copy produced by the render-config initContainer.
        - name: e2term-config-rw
          mountPath: /opt/e2/config
        # e2term writes all E2AP processing logs to /log/e2term.log.
        # Without this volume, those logs are silently lost (the directory
        # does not exist in the image) and E2 failures are invisible.
        - name: e2term-log
          mountPath: /log
        resources:
          requests:
            cpu: 150m
            memory: 192Mi
      volumes:
      - name: e2term-config-ro
        configMap:
          name: e2term-config
      - name: e2term-config-rw
        emptyDir: {}
      # Writable log directory for e2term's E2AP processing logs.
      # Access via: kubectl exec -n near-rt-ric deploy/ric-e2term -- cat /log/e2term.log
      - name: e2term-log
        emptyDir: {}
---
