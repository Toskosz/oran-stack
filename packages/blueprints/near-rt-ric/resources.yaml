# Source: near-rt-ric/templates/deployments.yaml
# ============================================================================
# Near-RT RIC Deployments and Services
# ============================================================================
# Startup ordering (mirrors docker-compose.ric.yml depends_on):
#
#   dbaas (healthy) → e2mgr (healthy) → {appmgr, submgr} → rtmgr
#                                                         ↓
#                                                    e2term (after 5s sleep)
#
# Implemented via initContainers that wait for upstream services using
# wget/curl health checks — the Kubernetes equivalent of depends_on.
#
# NOTE: All RIC components reference each other by short hostnames
# (ric-e2mgr, ric-e2term, etc.) in their RMR routing tables. This works
# because all pods are in the same namespace and the Service names match.
# ============================================================================

# --- DBAAS (Redis shared data layer) -----------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ric-dbaas
  namespace: near-rt-ric
  labels:
    app: ric-dbaas
    app.kubernetes.io/part-of: oran-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ric-dbaas
  template:
    metadata:
      labels:
        app: ric-dbaas
    spec:
      containers:
      - name: redis
        image: nexus3.o-ran-sc.org:10001/o-ran-sc/ric-plt-dbaas:0.6.5
        imagePullPolicy: IfNotPresent
        # SDL redismodule provides MSETMPUB required by e2mgr
        # UpdateNodebInfoOnConnectionStatusInversion. Without it, CONNECTED
        # status update fails and E2SetupResponse (12002) is never sent.
        args:
        - redis-server
        - --loadmodule
        - /usr/local/libexec/redismodule/libredismodule.so
        - --save
        - ""
        - --appendonly
        - "no"
        ports:
        - containerPort: 6379
          name: redis
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
---
# Source: near-rt-ric/templates/deployments.yaml
# --- E2MGR (E2 Manager) -------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ric-e2mgr
  namespace: near-rt-ric
  labels:
    app: ric-e2mgr
    app.kubernetes.io/part-of: oran-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ric-e2mgr
  template:
    metadata:
      labels:
        app: ric-e2mgr
    spec:
      initContainers:
      - name: wait-for-dbaas
        image: redis:6-alpine
        command: ["sh", "-c", "until redis-cli -h ric-dbaas ping; do echo waiting for dbaas; sleep 2; done"]
      containers:
      - name: e2mgr
        image: nexus3.o-ran-sc.org:10001/o-ran-sc/ric-plt-e2mgr:6.0.8
        imagePullPolicy: IfNotPresent
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/lib
        - name: RMR_SEED_RT
          value: /opt/E2Manager/router.txt
        - name: RMR_VCTL_FILE
          value: /tmp/rmr.verbose
        - name: RMR_RTG_SVC
          value: ric-rtmgr:4561
        # Without RMR_SRC_ID, RMR defaults to $HOSTNAME (pod name).
        # rtmgr pushes sender-qualified routes keyed on ric-e2mgr:3801
        # (mse|1101|ric-e2mgr:3801|…|ric-e2term:38000). A pod-name src
        # never matches, so keepalive and E2SetupResponse cannot leave
        # e2mgr (RMR open=0/succ=0) and the CU aborts after 10 minutes.
        - name: RMR_SRC_ID
          value: ric-e2mgr
        - name: port
          value: "3800"
        - name: DBAAS_SERVICE_HOST
          value: ric-dbaas
        - name: DBAAS_SERVICE_PORT
          value: "6379"
        ports:
