# ============================================================================
# RBAC for Near-RT RIC
# ============================================================================
# e2term validates its pod_name at startup by querying the Kubernetes API
# (GET /api/v1/namespaces/<ns>/pods/<pod_name>).  Without these permissions
# the default ServiceAccount gets a 403, which is reported as:
#   "illegal pod_name or environment variable not exists : <pod>"
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ric-e2term
  namespace: near-rt-ric
---
# Source: near-rt-ric/templates/configmaps.yaml
# ============================================================================
# ConfigMaps for Near-RT RIC components
# ============================================================================
# Each RIC component has its own ConfigMap. This mirrors the per-component
# volume mounts in docker-compose.ric.yml.
#
# IMPORTANT: The RMR routing table files (router.txt, dockerRouter.txt, etc.)
# use hostnames like 'ric-e2mgr', 'ric-e2term', 'ric-submgr'. These resolve
# correctly in Kubernetes because the Service names in this chart match those
# hostnames exactly — same as they did in Docker Compose.
# ============================================================================

# --- e2mgr configuration and routing table -----------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2mgr-config
  namespace: near-rt-ric
  labels:
    app.kubernetes.io/part-of: oran-stack
data:
  configuration.yaml: |
    logging:
      logLevel: debug
    http:
      port: 3800
    rmr:
      port: 3801
      maxMsgSize: 65536
    routingManager:
      baseUrl: http://ric-rtmgr:3800/ric/v1/handles/
    notificationResponseBuffer: 100
    bigRedButtonTimeoutSec: 5
    maxRnibConnectionAttempts: 3
    rnibRetryIntervalMs: 10
    keepAliveResponseTimeoutMs: 120000
    keepAliveDelayMs: 60000
    e2tInstanceDeletionTimeoutMs: 86400000
    e2ResetTimeOutSec: 10
    globalRicId:
      ricId: "AACCE"
      mcc: "001"
      mnc: "01"
    rnibWriter:
      stateChangeMessageChannel: RAN_CONNECTION_STATUS_CHANGE
      ranManipulationMessageChannel: RAN_MANIPULATION
  # mdclog dynamic level file mounted at /etc/config/log-level.yaml.
  # e2mgr main.go passes -f to this file and UnmarshalKey("loglevel") as int:
  #   1=ERROR 2=WARNING 3=INFO 4=DEBUG. A string like "log-level: debug" leaves
  #   loglevel=0 and silences all Infof/Errorf after startup (hides Setup/12002).
  log-level.yaml: |
    loglevel: 4
  # Seed routes aligned with rtmgr messagetypes:
  #   1100=E2_TERM_INIT, 1101=KEEP_ALIVE_REQ, 1102=KEEP_ALIVE_RESP,
  #   12001=E2_SETUP_REQ, 12002=E2_SETUP_RESP, 12003=E2_SETUP_FAILURE
  # Outbound from e2mgr: KA_REQ + setup responses go to e2term.
  router.txt: |
    newrt|start
    rte|1080|ric-e2term:38000
    rte|1090|ric-e2term:38000
    rte|1101|ric-e2term:38000
    rte|1200|ric-submgr:4560
    rte|1210|ric-submgr:4560
    rte|1220|ric-submgr:4560
    rte|12002|ric-e2term:38000
    rte|12003|ric-e2term:38000
    rte|12010|ric-e2mgr:3801
    rte|12011|ric-e2mgr:3801
    rte|12012|ric-e2mgr:3801
    rte|12020|ric-e2mgr:3801
    rte|12021|ric-e2mgr:3801
    rte|12050|ric-e2mgr:3801
    rte|12052|ric-e2mgr:3801
    newrt|end
---
# Source: near-rt-ric/templates/configmaps.yaml
# --- e2term configuration and routing table ----------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2term-config
  namespace: near-rt-ric
  labels:
    app.kubernetes.io/part-of: oran-stack
data:
  # config.conf: local-ip is the address e2term advertises to e2mgr as its
  # E2T / RMR endpoint. It MUST be the PRIMARY pod IP (Flannel eth0), NOT the
  # secondary OVS IP — e2mgr lives only on the Flannel network and has no
  # route to the 10.200.3.0/24 OVS bridge, so an OVS-IP E2T is unreachable and
  # keepalive fails (E2T deleted → CU E2 Setup aborts). The placeholder below
  # is replaced with status.podIP by the render-config initContainer.
  # SCTP E2AP still binds 0.0.0.0:36421, so the DU keeps reaching e2term on the
  # secondary OVS IP (secondaryNetworks.e2.e2termIP) for E2AP.
  config.conf: |
    nano=38000
    volume=/log
    local-ip=POD_IP_PLACEHOLDER
    prometheusMode=pull
    prometheusPushTimeOut=10
    prometheusPushAddr=127.0.0.1:7676
    prometheusPort=8088
    trace=start
    external-fqdn=ric-e2term
    pod_name=E2TERM_POD_NAME
    sctp-port=36421
  dockerRouter.txt: |
    newrt|start
    rte|1080|ric-e2mgr:3801
    rte|1090|ric-e2mgr:3801
    rte|1100|ric-e2mgr:3801
    rte|1101|ric-e2mgr:3801
    rte|1102|ric-e2mgr:3801
    rte|12001|ric-e2mgr:3801
    rte|12010|ric-e2mgr:3801
    rte|12011|ric-e2mgr:3801
    rte|12012|ric-e2mgr:3801
    rte|12020|ric-e2mgr:3801
    rte|12021|ric-e2mgr:3801
    rte|12050|ric-e2mgr:3801
    rte|12052|ric-e2mgr:3801
    rte|1200|ric-submgr:4560
    rte|1210|ric-submgr:4560
    rte|1220|ric-submgr:4560
    newrt|end
---
