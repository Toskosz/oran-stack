apiVersion: v1
kind: ServiceAccount
metadata:
  name: verify-e2
  namespace: oran-verify
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oran-verify-e2
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oran-verify-e2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oran-verify-e2
subjects:
- kind: ServiceAccount
  name: verify-e2
  namespace: oran-verify
---
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-e2
  namespace: oran-verify
  labels:
    app: verify-e2
    oran.stack/gate: e2
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: verify-e2
    spec:
      serviceAccountName: verify-e2
      restartPolicy: Never
      containers:
        - name: verify
          image: bitnamilegacy/kubectl:1.30
          imagePullPolicy: IfNotPresent
          env:
            - name: E2_NODE_ID
              valueFrom:
                configMapKeyRef:
                  name: oran-lab-settings
                  key: E2_NODE_ID
            - name: RIC_NS
              value: near-rt-ric
            - name: RAN_NS
              value: ran
          envFrom:
            - configMapRef:
                name: oran-verification-settings
                optional: true
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              WAIT_RETRIES="${E2_WAIT_RETRIES:-30}"
              WAIT_DELAY="${E2_WAIT_DELAY:-10}"
              E2_RECOVERY_ENABLED="${E2_RECOVERY_ENABLED:-true}"
              echo "Waiting for gNB ${E2_NODE_ID} in e2mgr..."
              for i in $(seq 1 "${WAIT_RETRIES}"); do
                STATES=$(kubectl exec -n "${RIC_NS}" deploy/ric-e2mgr -c e2mgr -- \
                  curl -sf http://localhost:3800/v1/nodeb/states 2>/dev/null || true)
                if echo "${STATES}" | grep -q "${E2_NODE_ID}"; then
                  echo "E2 OK — ${E2_NODE_ID} registered"
                  echo "${STATES}"
                  exit 0
                fi
                echo "attempt ${i}/${WAIT_RETRIES}: not yet registered"
                sleep "${WAIT_DELAY}"
              done

              # Single recovery: OCUDU does not retry E2 Setup after abort.
              E2T=$(kubectl exec -n "${RIC_NS}" deploy/ric-e2mgr -c e2mgr -- \
                curl -sf http://localhost:3800/v1/e2t/list 2>/dev/null || true)
              if [[ "${E2_RECOVERY_ENABLED}" == "true" ]] \
                 && echo "${E2T}" | grep -q e2tAddress; then
                echo "E2T present but gNB absent — restarting CU then DU once"
                kubectl rollout restart deployment/ocudu-cu -n "${RAN_NS}"
                kubectl rollout status deployment/ocudu-cu -n "${RAN_NS}" --timeout=300s
                kubectl rollout restart deployment/ocudu-du -n "${RAN_NS}"
                kubectl rollout status deployment/ocudu-du -n "${RAN_NS}" --timeout=300s
                for i in $(seq 1 "${WAIT_RETRIES}"); do
                  STATES=$(kubectl exec -n "${RIC_NS}" deploy/ric-e2mgr -c e2mgr -- \
                    curl -sf http://localhost:3800/v1/nodeb/states 2>/dev/null || true)
                  if echo "${STATES}" | grep -q "${E2_NODE_ID}"; then
                    echo "E2 OK after recovery — ${E2_NODE_ID}"
                    exit 0
                  fi
                  sleep "${WAIT_DELAY}"
                done
              fi
              echo "ERROR: gNB ${E2_NODE_ID} never registered in e2mgr"
              echo "--- e2mgr /v1/nodeb/states ---"
              echo "${STATES:-<unavailable>}"
              echo "--- e2mgr /v1/e2t/list ---"
              echo "${E2T:-<unavailable>}"
              echo "--- CU E2 log lines ---"
              kubectl logs -n "${RAN_NS}" deployment/ocudu-cu --tail=800 2>/dev/null |
                grep -iE 'E2-CU|E2AP|E2 Setup|36421|Near-RT|aborted' |
                tail -40 || true
              echo "--- e2mgr -> ric-e2term:38000 ---"
              kubectl exec -n "${RIC_NS}" deploy/ric-e2mgr -c e2mgr -- \
                sh -c "curl -sv --connect-timeout 4 -m 5 telnet://ric-e2term:38000 2>&1 |
                  grep -iE 'connected|refused|timed out' | head -1" || true
              echo "--- e2mgr identity ---"
              kubectl exec -n "${RIC_NS}" deploy/ric-e2mgr -c e2mgr -- \
                sh -c 'printf "RMR_SRC_ID=%s HOSTNAME=%s\n" "${RMR_SRC_ID:-<unset>}" "$(hostname)"' \
                || true
              echo "--- e2term E2AP log ---"
              kubectl exec -n "${RIC_NS}" deploy/ric-e2term -- \
                sh -c 'tail -40 /log/e2term.log 2>/dev/null || echo "<no /log/e2term.log>"' \
                || true
              echo "Checklist: RMR_SRC_ID must be ric-e2mgr; e2term local-ip must use"
              echo "the primary pod IP; restart CU only after RIC RMR routes are healthy."
              exit 1
