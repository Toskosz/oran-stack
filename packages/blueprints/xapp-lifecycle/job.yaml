apiVersion: v1
kind: ServiceAccount
metadata:
  name: xapp-lifecycle
  namespace: oran-verify
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oran-xapp-lifecycle
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oran-xapp-lifecycle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oran-xapp-lifecycle
subjects:
  - kind: ServiceAccount
    name: xapp-lifecycle
    namespace: oran-verify
---
apiVersion: batch/v1
kind: Job
metadata:
  name: xapp-lifecycle
  namespace: oran-verify
  labels:
    app: xapp-lifecycle
    oran.stack/gate: xapp
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: xapp-lifecycle
    spec:
      serviceAccountName: xapp-lifecycle
      restartPolicy: Never
      containers:
        - name: verify
          image: bitnamilegacy/kubectl:1.30
          imagePullPolicy: IfNotPresent
          env:
            - name: XAPP_NS
              value: ricxapp
            - name: XAPP_DEPLOYMENT
              value: r4-simple-mon
            - name: RIC_NS
              value: near-rt-ric
            - name: E2_NODE_ID
              valueFrom:
                configMapKeyRef:
                  name: oran-lab-settings
                  key: E2_NODE_ID
          envFrom:
            - configMapRef:
                name: xapp-lifecycle-settings
                optional: true
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              WAIT_RETRIES="${WAIT_RETRIES:-18}"
              WAIT_DELAY="${WAIT_DELAY:-5}"
              INDICATION_RETRIES="${INDICATION_RETRIES:-10}"
              INDICATION_DELAY="${INDICATION_DELAY:-10}"
              XAPP_SINCE=""
              XAPP_RMR="service-ricxapp-${XAPP_DEPLOYMENT}-rmr.${XAPP_NS}:4561"
              EP="service-ricxapp-${XAPP_DEPLOYMENT}-rmr.${XAPP_NS}"
              RTMGR="http://ric-rtmgr.${RIC_NS}:3800/ric/v1/handles/xapp-subscription-handle"
              # 1 Hz KPM is ~7 lines/indication. 20000 lines covers ~45 min, so
              # AppMgr/subscribe lines are still visible after xapp-simple-mon
              # and Config Sync. Do not use --tail=300: that window is only
              # ~40s of indications and hides the one-time register line.
              XAPP_LOG_TAIL=20000
              XAPP_LOG_FILE="$(mktemp)"
              trap 'rm -f "${XAPP_LOG_FILE:-}"' EXIT

              newest_pod() {
                kubectl get pods -n "$1" -l "app=$2" \
                  --field-selector=status.phase=Running \
                  --sort-by=.metadata.creationTimestamp \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
                  | tail -1
              }

              xapp_start_time() {
                kubectl get pods -n "${XAPP_NS}" -l "app=${XAPP_DEPLOYMENT}" \
                  --field-selector=status.phase=Running \
                  --sort-by=.metadata.creationTimestamp \
                  -o jsonpath='{.items[-1:].status.startTime}'
              }

              xapp_logs() {
                local pod
                pod="$(newest_pod "${XAPP_NS}" "${XAPP_DEPLOYMENT}")"
                if [[ -z "${pod}" ]]; then
                  return 0
                fi
                kubectl logs -n "${XAPP_NS}" "pod/${pod}" -c xapp \
                  --tail="${XAPP_LOG_TAIL}" 2>/dev/null || true
              }

              refresh_xapp_log() {
                xapp_logs >"${XAPP_LOG_FILE}"
              }

              # grep -q on a pipe exits at the first match and SIGPIPEs the
              # writer. With pipefail that is a failed check even when the
              # string is present (register is near line 4 of a 10k-line log).
              log_has() {
                grep -Fq "$1" "$2"
              }

              text_has() {
                grep -Fq "$1" <<<"$2"
              }

              text_has_re() {
                grep -Eq "$1" <<<"$2"
              }

              dump_excerpt_file() {
                local file="$1" total
                total="$(wc -l <"${file}")"
                if (( total <= 80 )); then
                  cat "${file}"
                  return 0
                fi
                echo "(log excerpt: first 40 and last 40 of ${total} lines)"
                set +o pipefail
                head -n 40 "${file}"
                echo "..."
                tail -n 40 "${file}"
                set -o pipefail
              }

              xapp_has_registration() {
                log_has "appmgr register" "${XAPP_LOG_FILE}" \
                  && log_has "HTTP 201" "${XAPP_LOG_FILE}"
              }

              xapp_has_clean_kpm() {
                log_has "RIC Indication Received" "${XAPP_LOG_FILE}" \
                  && log_has "Successfully subscribed" "${XAPP_LOG_FILE}" \
                  && ! log_has "ApiException" "${XAPP_LOG_FILE}" \
                  && ! grep -Eq 'HTTP[[:space:]]*503' "${XAPP_LOG_FILE}"
              }

              parse_subid() {
                grep -Eo 'mapping: .* -> [0-9]+' "${XAPP_LOG_FILE}" \
                  | awk '{print $NF}' | tail -1 || true
              }

              start_route_keep() {
                echo "Preserving subscription routes for E2EventInstanceId ${SUBID}..."
                kubectl delete pod xapp-route-keep -n "${XAPP_NS}" \
                  --ignore-not-found --wait=true --timeout=60s >/dev/null 2>&1 || true
                kubectl run xapp-route-keep -n "${XAPP_NS}" --restart=Never \
                  --image=curlimages/curl:8.5.0 --command -- \
                  sh -c "while true; do
                    curl -sf -X POST '${RTMGR}' \
                      -H 'Content-Type: application/json' \
                      -d '{\"address\":\"${EP}\",\"port\":4561,\"subscription_id\":${SUBID}}' \
                      >/dev/null || true
                    sleep 1
                  done"
                kubectl wait --for=condition=Ready pod/xapp-route-keep \
                  -n "${XAPP_NS}" --timeout=60s
              }

              rtmgr_logs() {
                local since="${1:-}"
                if [[ -n "${since}" ]]; then
                  kubectl logs -n "${RIC_NS}" "pod/${RTMGR_POD}" -c rtmgr \
                    --since-time="${since}" 2>/dev/null || true
                else
                  kubectl logs -n "${RIC_NS}" "pod/${RTMGR_POD}" -c rtmgr \
                    2>/dev/null || true
                fi
              }

              wait_for_xapp_log() {
                local description="$1"
                shift
                local pattern i matched
                for i in $(seq 1 "${WAIT_RETRIES}"); do
                  refresh_xapp_log
                  matched=true
                  for pattern in "$@"; do
                    if ! log_has "${pattern}" "${XAPP_LOG_FILE}"; then
                      matched=false
                    fi
                  done
                  if ${matched}; then
                    echo "xApp ${description} confirmed"
                    return 0
                  fi
                  echo "attempt ${i}/${WAIT_RETRIES}: waiting for ${description}"
                  sleep "${WAIT_DELAY}"
                done
                echo "ERROR: xApp ${description} not confirmed" >&2
                dump_excerpt_file "${XAPP_LOG_FILE}" >&2
                return 1
              }

              wait_for_a1_attached() {
                local i logs
                echo "Waiting for RTMgr to attach A1MEDIATOR..."
                for i in $(seq 1 "${WAIT_RETRIES}"); do
                  logs="$(rtmgr_logs)"
                  # Success is the case-sensitive name lookup. rtmgr only
                  # dumps "Endpoints: map[" when that lookup fails.
                  if text_has 'name: A1MEDIATOR' "${logs}"; then
                    echo "A1MEDIATOR attached on ${RTMGR_POD}"
                    return 0
                  fi
                  echo "attempt ${i}/${WAIT_RETRIES}: waiting for A1MEDIATOR wormhole"
                  sleep "${WAIT_DELAY}"
                done
                echo "ERROR: RTMgr did not attach A1MEDIATOR" >&2
                printf '%s\n' "${logs}" >&2
                return 1
              }

              ensure_a1_headless() {
                local cip i
                cip="$(kubectl get svc ric-a1mediator -n "${RIC_NS}" \
                  -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"
                if [[ -z "${cip}" || "${cip}" == "None" ]]; then
                  echo "ric-a1mediator Service is headless"
                  return 0
                fi
                echo "Recreating ric-a1mediator as headless (was ClusterIP ${cip})"
                kubectl delete svc ric-a1mediator -n "${RIC_NS}" --ignore-not-found
                for i in $(seq 1 30); do
                  cip="$(kubectl get svc ric-a1mediator -n "${RIC_NS}" \
                    -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"
                  if [[ "${cip}" == "None" ]]; then
                    echo "ric-a1mediator Service is headless"
                    return 0
                  fi
                  sleep 2
                done
                echo "ERROR: ric-a1mediator still has clusterIP=${cip:-missing}" >&2
                echo "Publish near-rt-ric with clusterIP: None, then delete the Service" >&2
                return 1
              }

              wait_for_platform_routes() {
                local i
                echo "Waiting for RTMgr to push platform routes to the xApp..."
                for i in $(seq 1 "${WAIT_RETRIES}"); do
                  RTMGR_LOGS="$(rtmgr_logs)"
                  if text_has \
                    "Update Routes to Endpoint: ${XAPP_RMR} successful" \
                    "${RTMGR_LOGS}"; then
                    echo "platform routes confirmed on ${RTMGR_POD}"
                    return 0
                  fi
                  echo "attempt ${i}/${WAIT_RETRIES}: waiting for xApp route push"
                  sleep "${WAIT_DELAY}"
                done
                echo "ERROR: RTMgr did not push xApp platform routes" >&2
                printf '%s\n' "${RTMGR_LOGS}" >&2
                return 1
              }

              wait_for_12050_routes() {
                local i since="${1:-}"
                echo "Waiting for RTMgr subscription indication routes since ${since:-pod start}..."
                for i in $(seq 1 "${WAIT_RETRIES}"); do
                  RTMGR_LOGS="$(rtmgr_logs "${since}")"
                  if text_has \
                       "RoutingManager->SubManager Add Request Success" \
                       "${RTMGR_LOGS}" \
                     && text_has \
                       "Update Routes to Endpoint: ${XAPP_RMR} successful" \
                       "${RTMGR_LOGS}" \
                     && text_has_re \
                       "Update Routes to Endpoint: ${XAPP_RMR} successful.*OK\\(# of Entries:9([^0-9]|$)" \
                       "${RTMGR_LOGS}" \
                     && text_has_re \
                       "Update Routes to Endpoint: ric-e2term:38000 successful.*OK\\(# of Entries:9([^0-9]|$)" \
                       "${RTMGR_LOGS}"; then
                    echo "12050 routes confirmed on ${RTMGR_POD}"
                    return 0
                  fi
                  echo "attempt ${i}/${WAIT_RETRIES}: waiting for 12050 routes"
                  sleep "${WAIT_DELAY}"
                done
                echo "ERROR: 12050 indication routes not confirmed on ${RTMGR_POD}" >&2
                printf '%s\n' "${RTMGR_LOGS}" >&2
                return 1
              }

              restart_xapp_and_subscribe() {
                echo "Restarting xApp against the synchronized route table..."
                kubectl rollout restart deployment/"${XAPP_DEPLOYMENT}" -n "${XAPP_NS}"
                kubectl rollout status deployment/"${XAPP_DEPLOYMENT}" \
                  -n "${XAPP_NS}" --timeout=300s
                XAPP_SINCE="$(xapp_start_time)"
                if [[ -z "${XAPP_SINCE}" ]]; then
                  XAPP_SINCE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                fi
                echo "Using xApp startTime ${XAPP_SINCE} (ignore earlier RTMgr logs)"
                wait_for_xapp_log "post-sync AppMgr registration" \
                  "appmgr register" "HTTP 201"
                wait_for_xapp_log "E2 subscription" \
                  "Subscribe to E2 node ID: ${E2_NODE_ID}" "Successfully subscribed"
              }

              wait_for_nonzero_subid() {
                local i
                echo "Waiting for non-zero E2EventInstanceId..."
                SUBID=""
                for i in $(seq 1 30); do
                  refresh_xapp_log
                  SUBID="$(parse_subid)"
                  if [[ -n "${SUBID}" && "${SUBID}" != "0" ]]; then
                    echo "E2EventInstanceId ${SUBID}"
                    return 0
                  fi
                  echo "attempt ${i}/30: waiting for non-zero instance id"
                  sleep 2
                done
                return 1
              }

              echo "Waiting for a clean KPM subscription or AppMgr registration..."
              registered=false
              for i in $(seq 1 "${WAIT_RETRIES}"); do
                refresh_xapp_log
                SUBID="$(parse_subid)"
                # Prefer an already-working xApp. Bouncing RTMgr here would
                # drop a live subscription and is the common one-go path
                # after xapp-simple-mon has already started indications.
                if xapp_has_clean_kpm \
                   && [[ -n "${SUBID}" && "${SUBID}" != "0" ]]; then
                  echo "xApp already has clean KPM (E2EventInstanceId ${SUBID}); skipping RTMgr bounce"
                  start_route_keep
                  echo "xApp OK — clean subscription and KPM indication received"
                  exit 0
                fi
                if xapp_has_registration; then
                  echo "xApp AppMgr registration confirmed"
                  registered=true
                  break
                fi
                echo "attempt ${i}/${WAIT_RETRIES}: waiting for AppMgr registration or KPM"
                sleep "${WAIT_DELAY}"
              done
              if ! ${registered}; then
                echo "ERROR: xApp AppMgr registration not confirmed" >&2
                dump_excerpt_file "${XAPP_LOG_FILE}" >&2
                exit 1
              fi

              ensure_a1_headless
              echo "Waiting for A1Mediator to be ready before RTMgr restart..."
              kubectl rollout status deployment/ric-a1mediator -n "${RIC_NS}" \
                --timeout=300s

              # Restart RTMgr only. Do not bounce A1 afterwards: RTMgr pins
              # A1's pod IP in /etc/hosts and opens the wormhole once. A1
              # Recreate makes that IP stale and the wormhole never retries
              # successfully. rtmgr looks up the endpoint as name A1MEDIATOR.
              echo "Restarting RTMgr so it reloads xApps from AppMgr..."
              kubectl rollout restart deployment/ric-rtmgr -n "${RIC_NS}"
              kubectl rollout status deployment/ric-rtmgr -n "${RIC_NS}" --timeout=300s
              RTMGR_POD="$(newest_pod "${RIC_NS}" ric-rtmgr)"
              if [[ -z "${RTMGR_POD}" ]]; then
                echo "ERROR: no running ric-rtmgr pod after rollout" >&2
                exit 1
              fi
              echo "Using RTMgr pod ${RTMGR_POD} (ignore leftover logs from the previous replica)"
              wait_for_a1_attached
              wait_for_platform_routes

              restart_xapp_and_subscribe
              wait_for_12050_routes "${XAPP_SINCE}" || true
              wait_for_nonzero_subid || true

              if [[ -z "${SUBID:-}" || "${SUBID}" == "0" ]]; then
                echo "Instance id still 0; restarting xApp once against attached A1/RTMgr..."
                restart_xapp_and_subscribe
                wait_for_12050_routes "${XAPP_SINCE}"
                if ! wait_for_nonzero_subid; then
                  echo "ERROR: non-zero E2EventInstanceId not found" >&2
                  dump_excerpt_file "${XAPP_LOG_FILE}" >&2
                  kubectl logs -n "${RIC_NS}" "pod/${RTMGR_POD}" -c rtmgr \
                    --since-time="${XAPP_SINCE}" --tail=80 >&2 || true
                  kubectl logs -n "${RIC_NS}" deployment/ric-submgr -c submgr \
                    --since=10m 2>/dev/null | tail -30 >&2 || true
                  exit 1
                fi
              fi

              start_route_keep

              echo "Waiting for an E2SM-KPM indication..."
              for i in $(seq 1 "${INDICATION_RETRIES}"); do
                refresh_xapp_log
                if xapp_has_clean_kpm; then
                  echo "xApp OK — clean subscription and KPM indication received"
                  exit 0
                fi
                echo "attempt ${i}/${INDICATION_RETRIES}: KPM indication not confirmed"
                sleep "${INDICATION_DELAY}"
              done

              echo "ERROR: xApp did not receive a clean KPM indication" >&2
              dump_excerpt_file "${XAPP_LOG_FILE}" >&2
              kubectl logs -n "${RIC_NS}" deployment/ric-rtmgr -c rtmgr \
                --since=10m 2>/dev/null | tail -80 >&2 || true
              exit 1
