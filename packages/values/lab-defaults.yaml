# Lab-default Helm values used by scripts/render-nephio-packages.sh.
# Mirrors ansible/inventories/group_vars/all/vars.yml deploy overrides.
# Re-render packages after changing this file or the charts.

# --- 5g-core ---
images:
  core:
    repository: x0tok/oran-5gcore
    tag: latest
    pullPolicy: IfNotPresent
  webui:
    repository: x0tok/oran-webui
    tag: latest
    pullPolicy: IfNotPresent
  ocudu:
    repository: x0tok/oran-ocudu
    tag: latest
    pullPolicy: IfNotPresent
  srsue:
    repository: x0tok/oran-srsue
    tag: latest
    pullPolicy: IfNotPresent

imagePullSecretName: dockerhub-secret

plmn:
  mcc: "001"
  mnc: "01"
  tac: "1"

secondaryNetworks:
  n2:
    nadName: n2br-net
    amfIP: "10.200.1.2"
    cuIP: "10.200.1.3"
  f1c:
    nadName: f1cbr-net
    cuIP: "10.200.2.2"
    duIP: "10.200.2.3"
  e2:
    nadName: e2br-net
    cuIP: "10.200.3.2"
    duIP: "10.200.3.3"
    e2termIP: "10.200.3.4"

# --- ran ---
e2Readiness:
  enabled: true
  e2mgrUrl: "http://ric-e2mgr.near-rt-ric.svc.cluster.local:3800"
  pollIntervalSec: 5

deployUE: true

ue:
  imsi: "001010000000001"
  k: "465B5CE8B199B49FAA5F0A2EE238A6BC"
  opc: "E8ED289DEBA952E4283B54E88E6183CA"
  apn: internet

# --- near-rt-ric ---
e2termStartupDelaySec: 30
e2mgr:
  keepAliveResponseTimeoutMs: 120000
  keepAliveDelayMs: 60000
  e2tInstanceDeletionTimeoutMs: 86400000

# --- xapp (merged with values/simple-mon.yaml) ---
image:
  repository: x0tok/oran-xapps
  tag: latest
  pullPolicy: IfNotPresent

ric:
  namespace: near-rt-ric
  submgrUri: "http://ric-submgr.near-rt-ric:8088/ric/v1"
  appmgrRegisterUri: "http://ric-appmgr.near-rt-ric:8080/ric/v1/register"

xapp:
  script: kpm_mon_xapp.py
  rmrPort: 4561
  httpPort: 8091
  args:
    - "--metrics=DRB.PacketSuccessRateUlgNBUu"
    - "--kpm_report_style=1"
    - "--rmr_port=4561"
    - "--http_server_port=8091"
  e2NodeId: "gnbc_001_001_00019b_0"
  ranFuncId: "2"

# --- monitoring ---
namespace: monitoring
