# Wait for the deterministic outcome: UE reaches RRC Connected + PDU Session.
# Readiness gate, not a restart loop.

- name: Wait for UE attach (RRC Connected + PDU Session Established)
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ _kubeconfig }} logs -n {{ namespaces.ran }}
      deployment/ocudu-du -c srsue --tail=200
  register: _ue_logs
  until: >-
    'RRC Connected' in _ue_logs.stdout and
    'PDU Session Established' in _ue_logs.stdout
  retries: "{{ verify_stack.ue_attach_wait_retries }}"
  delay: "{{ verify_stack.ue_attach_wait_delay }}"
  changed_when: false
  failed_when: false

- name: Set UE attach fact
  ansible.builtin.set_fact:
    _ue_attached: >-
      {{ 'RRC Connected' in _ue_logs.stdout and
         'PDU Session Established' in _ue_logs.stdout }}

- name: Collect UE diagnostics when attach did not complete
  when: not (_ue_attached | bool)
  block:
    - name: Dump structured UE attach diagnostics
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/../../scripts/collect-ue-diagnostics.sh"
          - --no-file
      environment:
        KUBECONFIG: "{{ _kubeconfig }}"
        RAN_NS: "{{ namespaces.ran }}"
        CORE_NS: "{{ namespaces.core | default('5g-core') }}"
        UE_IMSI: "001010000000001"
      register: _ue_diag
      changed_when: false
      failed_when: false

    - name: Fail with actionable UE diagnostics
      ansible.builtin.fail:
        msg: |-
          UE did NOT complete attach within
          {{ verify_stack.ue_attach_wait_retries | int * verify_stack.ue_attach_wait_delay | int }}s.

          {{ _ue_diag.stdout | default('') }}

          If the UE is stuck at 'Switching on' with no PRACH in the DU:
            1. Confirm ZMQ is localhost sidecar (127.0.0.1 in ocudu-configs) —
               cross-pod ClusterIP ZMQ only handshakes and never streams IQ.
            2. Confirm coreset0_index=12 and UE nof_prb=106 (20 MHz).
            3. Confirm MongoDB has the subscriber (deploy_5g_core mongodb_init).
            4. Do not TCP-probe 127.0.0.1:2000 (nc /dev/tcp); that deadlocks ZMQ IQ.
      when: verify_stack.ue_attach_required | bool

    - name: Warn (non-fatal) that UE attach is unconfirmed
      ansible.builtin.debug:
        msg: >-
          WARNING: UE attach unconfirmed. Check
          'kubectl logs -n {{ namespaces.ran }} deployment/ocudu-du -c srsue -f'.
      when: not (verify_stack.ue_attach_required | bool)

- name: Show UE attach result
  ansible.builtin.debug:
    msg: "UE OK — RRC Connected and PDU Session Established"
  when: _ue_attached | bool
