# ============================================================================
# Role: deploy_ran
# Purpose: Deploy the ran Helm chart (OCUDU CU, DU + srsUE) onto the kubeadm cluster.
#   1. Create namespace with privileged pod-security label
#   2. Create imagePullSecret
#   3. helm upgrade --install ran
#   4. Prune obsolete Deployments from older chart revisions
#   5. Wait for ocudu-cu + ocudu-du Available (live status, fail-fast)
# ============================================================================
---

- name: Set kubeconfig fact
  ansible.builtin.set_fact:
    _kubeconfig: "{{ playbook_dir }}/../../kubeconfig"

# ----------------------------------------------------------------------------
# 1. Create ran namespace
# ----------------------------------------------------------------------------
- name: Create ran namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ _kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ namespaces.ran }}"
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/warn:    privileged
          pod-security.kubernetes.io/audit:   privileged

# ----------------------------------------------------------------------------
# 2. Create Docker Hub imagePullSecret in ran namespace
# ----------------------------------------------------------------------------
- name: Create Docker Hub imagePullSecret in ran namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ _kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name:      "{{ image_pull_secret_name }}"
        namespace: "{{ namespaces.ran }}"
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{ ({
            "auths": {
              "https://index.docker.io/v1/": {
                "username": dockerhub_username,
                "password": dockerhub_password,
                "auth": (dockerhub_username ~ ":" ~ dockerhub_password) | b64encode
              }
            }
          }) | to_json | b64encode }}
  no_log: true

# ----------------------------------------------------------------------------
# 3. Helm upgrade --install ran
#    SCTP interfaces (N2, F1-C, E2AP) use static secondary OVS IPs defined
#    in secondaryNetworks in values.yaml. Override here only if the operator
#    has customised the IP ranges in group_vars/all/vars.yml.
# ----------------------------------------------------------------------------
- name: Deploy ran Helm chart
  kubernetes.core.helm:
    kubeconfig: "{{ _kubeconfig }}"
    name:             "{{ helm_releases.ran }}"
    chart_ref:        "{{ playbook_dir }}/../../{{ helm_charts.ran }}"
    release_namespace: "{{ namespaces.ran }}"
    create_namespace: false
    wait:             false
    values:
      images:
        ocudu:
          repository: "{{ images.ocudu.repository }}"
          tag:         "{{ images.ocudu.tag }}"
        srsue:
          repository: "{{ images.srsue.repository }}"
          tag:         "{{ images.srsue.tag }}"
      e2Readiness:
        enabled: true
        e2mgrUrl: "http://ric-e2mgr.{{ namespaces.ric }}.svc.cluster.local:3800"
      plmn:
        mcc: "{{ plmn.mcc }}"
        mnc: "{{ plmn.mnc }}"
        tac: "{{ plmn.tac }}"
      secondaryNetworks:
        n2:
          nadName:  "{{ secondary_networks.n2.nad_name }}"
          amfIP:    "{{ secondary_networks.n2.amf_ip }}"
          cuIP:     "{{ secondary_networks.n2.cu_ip }}"
        f1c:
          nadName:  "{{ secondary_networks.f1c.nad_name }}"
          cuIP:     "{{ secondary_networks.f1c.cu_ip }}"
          duIP:     "{{ secondary_networks.f1c.du_ip }}"
        e2:
          nadName:   "{{ secondary_networks.e2.nad_name }}"
          cuIP:      "{{ secondary_networks.e2.cu_ip }}"
          duIP:      "{{ secondary_networks.e2.du_ip }}"
          e2termIP:  "{{ secondary_networks.e2.e2term_ip }}"
  register: helm_ran

# Orphan Deployments (e.g. standalone srsue from older chart revisions) make
# `kubectl wait --all` hang forever. Prune known obsolete names before waiting.
- name: Remove obsolete ran Deployments left from older chart revisions
  kubernetes.core.k8s:
    kubeconfig: "{{ _kubeconfig }}"
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ namespaces.ran }}"
    wait: false
  loop:
    - srsue
    - srs-cu
    - srs-du
  failed_when: false

- name: Wait for ran Deployments with live status output
  ansible.builtin.shell: |
    set +e
    K="kubectl --kubeconfig={{ _kubeconfig }}"
    NS="{{ namespaces.ran }}"

    echo "=== $(date -u +%H:%M:%S) ran namespace ==="
    $K get pods -n "$NS" -o wide 2>&1
    echo "--- deployments ---"
    $K get deploy -n "$NS" \
      -o custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas,DESIRED:.spec.replicas' 2>&1
    echo "--- helm ---"
    helm --kubeconfig="{{ _kubeconfig }}" status "{{ helm_releases.ran }}" -n "$NS" 2>&1 | head -5
    echo "--- not ready / waiting ---"
    $K get pods -n "$NS" --field-selector=status.phase!=Running 2>/dev/null
    $K get pods -n "$NS" -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.phase}{"\t"}{range .status.initContainerStatuses[*]}{.name}:{.state.waiting.reason}{.state.terminated.reason}{" "}{end}{range .status.containerStatuses[*]}{.name}:{.state.waiting.reason}{.state.terminated.reason}{" "}{end}{"\n"}{end}' 2>/dev/null
    echo

    # Fail-fast: image/config errors will never self-heal within the wait budget.
    TERMINAL="$($K get pods -n "$NS" -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.state.waiting.reason}{"\n"}{end}{range .status.initContainerStatuses[*]}{.state.waiting.reason}{"\n"}{end}{end}' 2>/dev/null)"
    if echo "$TERMINAL" | grep -Eq '^(ImagePullBackOff|ErrImagePull|InvalidImageName|CreateContainerConfigError)$'; then
      echo "ERROR: terminal pod error — aborting wait early"
      echo "$TERMINAL" | grep -E 'ImagePullBackOff|ErrImagePull|InvalidImageName|CreateContainerConfigError' | sort -u
      $K describe pods -n "$NS" 2>&1 | tail -60
      exit 42
    fi

    # Wait only for chart Deployments (never --all: orphans block forever).
    $K wait --for=condition=available deployment/ocudu-cu deployment/ocudu-du \
      -n "$NS" --timeout=20s >/dev/null 2>&1
    rc=$?
    if [ "$rc" -eq 0 ]; then
      echo "ocudu-cu and ocudu-du are Available"
    fi
    exit "$rc"
  register: _ran_wait
  until: _ran_wait.rc in [0, 42]
  retries: "{{ ((helm_timeout | regex_replace('s$', '') | int) // 20) | int }}"
  delay: 15
  changed_when: false
  failed_when: _ran_wait.rc != 0

- name: Show final ran pod status
  ansible.builtin.debug:
    msg: "{{ _ran_wait.stdout_lines }}"

- name: Show ran Helm release status
  ansible.builtin.debug:
    msg: "ran release deployed (revision {{ helm_ran.status.revision | default('unknown') }}); stack_stabilize runs next"
