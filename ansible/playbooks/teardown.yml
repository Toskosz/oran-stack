# ============================================================================
# Playbook: teardown.yml
# Purpose:  Remove all deployed resources in reverse order, then reset the
#           kubeadm cluster state on all nodes.
#
# Usage:
#   ansible-playbook ./playbooks/teardown.yml --ask-vault-pass
#   vagrant destroy -f          # to also destroy the VMs
#
# WARNING: This is DESTRUCTIVE. It will:
#   - Stop Config Sync (RootSync) so GitOps cannot recreate namespaces
#   - Uninstall Helm releases (legacy path; no-op when NFs were GitOps-applied)
#   - Delete the 5g-core, near-rt-ric, ran, ricxapp, monitoring, oran-verify
#     namespaces
#   - Run kubeadm reset --force on all nodes
#   - Remove CNI state, iptables rules, and kubeconfigs from the nodes
#   - Remove the local ./kubeconfig file
#
# any_errors_fatal: false is used so a missing release or absent RootSync
# (e.g. partial / Helm-only deployment) does not abort the teardown.
# ============================================================================
---
- name: Stop GitOps, uninstall releases, delete namespaces
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: false
  vars:
    _kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
    _teardown_namespaces:
      - "{{ namespaces.monitoring }}"
      - "{{ namespaces.xapp }}"
      - "{{ namespaces.ran }}"
      - "{{ namespaces.ric }}"
      - "{{ namespaces.core }}"
      - oran-verify

  tasks:
    # Config Sync owns the NF namespaces (ns-and-secrets in oran-lab). Deleting
    # them while RootSync is still reconciling leaves them Terminating: the
    # reconciler recreates child objects faster than the namespace can drain.
    - name: Delete Config Sync RootSync (stop GitOps reconciliation)
      kubernetes.core.k8s:
        state: absent
        kubeconfig: "{{ _kubeconfig }}"
        api_version: configsync.gke.io/v1beta1
        kind: RootSync
        name: "{{ nephio_rootsync_name }}"
        namespace: "{{ nephio_rootsync_namespace }}"
        wait: true
        wait_timeout: 180
      ignore_errors: true

    - name: Wait until Config Sync root reconciler pods are gone
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        kind: Pod
        namespace: "{{ nephio_rootsync_namespace }}"
        label_selectors:
          - "configsync.gke.io/sync-name={{ nephio_rootsync_name }}"
      register: _rootsync_pods
      until: (_rootsync_pods.resources | default([])) | length == 0
      retries: 36
      delay: 5
      ignore_errors: true

    - name: Uninstall monitoring Helm release
      kubernetes.core.helm:
        name:              "{{ helm_releases.monitoring }}"
        release_namespace: "{{ namespaces.monitoring }}"
        state: absent
        wait: true
        wait_timeout: "120s"
        kubeconfig: "{{ _kubeconfig }}"
      ignore_errors: true

    - name: Uninstall xApp Helm release
      kubernetes.core.helm:
        name:              "{{ helm_releases.xapp }}"
        release_namespace: "{{ namespaces.xapp }}"
        state: absent
        wait: true
        wait_timeout: "120s"
        kubeconfig: "{{ _kubeconfig }}"
      ignore_errors: true

    - name: Uninstall ran Helm release
      kubernetes.core.helm:
        name:              "{{ helm_releases.ran }}"
        release_namespace: "{{ namespaces.ran }}"
        state: absent
        wait: true
        wait_timeout: "120s"
        kubeconfig: "{{ _kubeconfig }}"
      ignore_errors: true

    - name: Uninstall near-rt-ric Helm release
      kubernetes.core.helm:
        name:              "{{ helm_releases.ric }}"
        release_namespace: "{{ namespaces.ric }}"
        state: absent
        wait: true
        wait_timeout: "120s"
        kubeconfig: "{{ _kubeconfig }}"
      ignore_errors: true

    - name: Uninstall 5g-core Helm release
      kubernetes.core.helm:
        name:              "{{ helm_releases.core }}"
        release_namespace: "{{ namespaces.core }}"
        state: absent
        wait: true
        wait_timeout: "180s"
        kubeconfig: "{{ _kubeconfig }}"
      ignore_errors: true

    # Delete namespaces so PVCs (MongoDB data) are also removed.
    - name: Delete NF namespaces
      kubernetes.core.k8s:
        state: absent
        kubeconfig: "{{ _kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
        wait: true
        wait_timeout: "{{ 120 if item == namespaces.core else 60 }}"
      loop: "{{ _teardown_namespaces }}"
      ignore_errors: true

    # Last resort if a controller left a finalizer after RootSync stopped.
    - name: Force-finalize namespaces still stuck Terminating
      ansible.builtin.shell: |
        set -uo pipefail
        KC="{{ _kubeconfig }}"
        NS="{{ item }}"
        ts=$(kubectl --kubeconfig="$KC" get ns "$NS" \
          -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)
        if [ -z "${ts}" ]; then
          exit 0
        fi
        kubectl --kubeconfig="$KC" get ns "$NS" -o json \
          | python3 -c 'import json,sys; d=json.load(sys.stdin); d["spec"]["finalizers"]=[]; json.dump(d, sys.stdout)' \
          | kubectl --kubeconfig="$KC" replace --raw "/api/v1/namespaces/${NS}/finalize" -f -
      args:
        executable: /bin/bash
      loop: "{{ _teardown_namespaces }}"
      ignore_errors: true
      changed_when: stdout | default('') | length > 0

- name: Reset kubeadm cluster on all nodes
  hosts: k8s_cluster
  become: true
  gather_facts: false

  roles:
    - role: kubeadm_teardown
