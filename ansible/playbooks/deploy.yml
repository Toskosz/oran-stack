# ============================================================================
# Playbook: deploy.yml
# Status:  DEPRECATED — use Nephio (Porch + Config Sync) instead.
#
# Primary path: docs/NEPHIO.md
#   1. provision-mgmt.yml + bootstrap-nephio.yml  (management)
#   2. provision.yml + workload-gitops.yml       (workload)
#   3. packages/variants/oran-lab-packagevariants.yaml
#
# This playbook remains for emergency / legacy Helm deploys only.
# Prefer NOT to mix Helm releases with Config Sync ownership of the same
# resources.
#
# Usage (legacy):
#   ansible-playbook ansible/playbooks/deploy.yml --ask-vault-pass
# ============================================================================
---
- name: Warn that deploy.yml is deprecated
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Print deprecation notice
      ansible.builtin.debug:
        msg: >-
          DEPRECATED: deploy.yml (Helm via Ansible) is replaced by Nephio
          PackageVariants + Config Sync. See docs/NEPHIO.md. Continuing with
          legacy Helm deploy...

- name: Deploy 5G core (Open5GS NFs + MongoDB)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [deploy_5g_core]

  roles:
    - role: deploy_5g_core

- name: Deploy Near-RT RIC (e2term, e2mgr, rtmgr, submgr, appmgr, a1mediator, dbaas)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [deploy_ric]

  roles:
    - role: deploy_ric

- name: Deploy RAN (OCUDU CU, DU + srsUE)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [deploy_ran]

  roles:
    - role: deploy_ran

- name: Verify E2 readiness before deploying the xApp
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [verify_stack, deploy_ran]

  tasks:
    - name: Run pre-xApp E2 verification stage
      ansible.builtin.include_role:
        name: verify_stack
        tasks_from: verify_e2.yml

- name: Deploy simple-mon xApp (KPM monitor) after E2 readiness
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [deploy_xapp, deploy_ran]

  roles:
    - role: deploy_xapp

- name: Verify xApp functional readiness before UE attachment
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [verify_stack, deploy_xapp, deploy_ran]

  tasks:
    - name: Run post-xApp functional and UE verification stage
      ansible.builtin.include_role:
        name: verify_stack
        tasks_from: verify_post_xapp.yml

- name: Deploy Monitoring (Prometheus + Grafana)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [deploy_monitoring]

  roles:
    - role: deploy_monitoring
