# =============================================================================
# Playbook: gcp-vm-create-mgmt.yml
# Purpose:  Provision one GCP VM for the Nephio management cluster.
#
# Usage:
#   ansible-playbook ansible/playbooks/gcp-vm-create-mgmt.yml
#   ansible-playbook ansible/playbooks/gcp-vm-create-mgmt.yml \
#     -e gcp_mgmt_machine_type=e2-standard-8
#
# Writes ansible/inventories/mgmt.ini (same SSH key defaults as workload VMs).
# =============================================================================
---
- name: Provision GCP VM for Nephio management cluster
  hosts: localhost
  connection: local
  gather_facts: false
  # Same defaults as roles/gcp_vm (this playbook does not include that role).
  # Override with -e (e.g. -e gcp_zone=europe-west1-b).
  vars:
    gcp_project: ""
    gcp_zone: "us-central1-a"
    gcp_image_family: "ubuntu-2204-lts"
    gcp_image_project: "ubuntu-os-cloud"
    gcp_disk_type: "pd-ssd"
    gcp_network: "default"
    gcp_tags: ["oran-dev"]
    gcp_ssh_user: "oran"
    gcp_ssh_pub_key_file: "~/.ssh/oran_gcp.pub"
    gcp_ssh_priv_key_file: "~/.ssh/oran_gcp"
    gcp_mgmt_name: "oran-mgmt"
    gcp_mgmt_machine_type: "e2-standard-4"
    gcp_mgmt_disk_size_gb: 80

  tasks:
    - name: Resolve GCP project
      ansible.builtin.command: gcloud config get-value project
      register: _gcp_project_cmd
      changed_when: false
      when: gcp_project | length == 0

    - name: Fail if no active GCP project
      ansible.builtin.fail:
        msg: >
          No active GCP project found.
          Run: gcloud config set project YOUR_PROJECT_ID
          Or pass: -e gcp_project=YOUR_PROJECT_ID
      when: >
        gcp_project | length == 0 and
        (_gcp_project_cmd.stdout | default('') | trim) == ""

    - name: Set GCP project fact
      ansible.builtin.set_fact:
        _gcp_project: "{{ gcp_project if gcp_project | length > 0 else (_gcp_project_cmd.stdout | trim) }}"

    - name: Create management VM
      google.cloud.gcp_compute_instance:
        name: "{{ gcp_mgmt_name }}"
        machine_type: "{{ gcp_mgmt_machine_type }}"
        zone: "{{ gcp_zone }}"
        project: "{{ _gcp_project }}"
        auth_kind: application
        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              source_image: "projects/{{ gcp_image_project }}/global/images/family/{{ gcp_image_family }}"
              disk_size_gb: "{{ gcp_mgmt_disk_size_gb }}"
              disk_type: "{{ gcp_disk_type }}"
        network_interfaces:
          - network:
              selfLink: "global/networks/{{ gcp_network }}"
            access_configs:
              - name: External NAT
                type: ONE_TO_ONE_NAT
        tags:
          items: "{{ gcp_tags }}"
        metadata:
          ssh-keys: "{{ gcp_ssh_user }}:{{ lookup('file', gcp_ssh_pub_key_file | expanduser) }}"
        state: present
      register: _mgmt_vm

    - name: Collect management VM IPs
      ansible.builtin.set_fact:
        _mgmt_ext: "{{ _mgmt_vm.networkInterfaces[0].accessConfigs[0].natIP }}"
        _mgmt_int: "{{ _mgmt_vm.networkInterfaces[0].networkIP }}"

    - name: Write mgmt.ini inventory
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../inventories/mgmt.ini"
        mode: "0644"
        content: |
          # Generated by gcp-vm-create-mgmt.yml — do not commit secrets
          [control_plane]
          {{ gcp_mgmt_name }} ansible_host={{ _mgmt_ext }} control_plane_ip={{ _mgmt_int }} ansible_user={{ gcp_ssh_user }}

          [workers]

          [k8s_cluster:children]
          control_plane
          workers

          [k8s_cluster:vars]
          ansible_ssh_private_key_file={{ gcp_ssh_priv_key_file }}
          ansible_python_interpreter=auto_legacy_silent
          nephio_mgmt_mode=true

          [local]
          localhost ansible_connection=local

    - name: Show next steps
      ansible.builtin.debug:
        msg: |
          Management VM {{ gcp_mgmt_name }} ready ({{ _mgmt_ext }}).
          Next:
            ansible-playbook ansible/playbooks/provision-mgmt.yml \
              -i ansible/inventories/mgmt.ini --ask-become-pass
            export KUBECONFIG=$(pwd)/kubeconfig-mgmt
            ansible-playbook ansible/playbooks/bootstrap-nephio.yml ...
