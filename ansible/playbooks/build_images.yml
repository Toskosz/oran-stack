# ============================================================================
# Playbook: build_images.yml
# Purpose:  Build Docker images for Open5GS NFs, WebUI, OCUDU, srsUE, and xApps from the
#           local repository and push them to Docker Hub.
#
# Usage (from ansible/ — inventory loads group_vars + vault via ansible.cfg):
#   ansible-playbook ./playbooks/build_images.yml -i inventories/gcp.ini
#   ansible-playbook ./playbooks/build_images.yml -i inventories/hosts.ini
#   ansible-playbook ./playbooks/build_images.yml -i inventories/lab.ini
#
# From repo root:
#   ansible-playbook ansible/playbooks/build_images.yml \
#     -i ansible/inventories/gcp.ini
#
# Pre-requisites:
#   - Docker daemon running on the Ansible controller
#   - All Dockerfiles present in their expected locations
#   - Inventory passed (-i) so group_vars load dockerhub_* from vault
#   - ~/.oran_vault_pass present (ansible.cfg vault_password_file)
# ============================================================================
---
- name: Build and push container images to Docker Hub
  hosts: localhost
  connection: local
  gather_facts: false

  roles:
    - role: container_images
