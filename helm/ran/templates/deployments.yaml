# ============================================================================
# OCUDU CU, DU, and srsUE Deployments + Services
# ============================================================================
# Startup ordering: CU → DU → UE (mirrors depends_on in docker-compose.cudu.yml)
# Implemented with initContainers that wait for the upstream pod's service.
#
# SCTP traffic (N2, F1-C, E2AP) uses dedicated OVS secondary interfaces
# (via Multus) with static IPs, eliminating the conntrack/VXLAN flapping
# that occurred when SCTP traversed the Flannel overlay network.
# ============================================================================

# --- CU (Central Unit) -------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocudu-cu
  namespace: {{ .Values.namespace }}
  labels:
    app: ocudu-cu
    app.kubernetes.io/part-of: oran-stack
spec:
  replicas: 1
  # DU holds off {{ .Values.duF1SetupHoldOffSec }}s after CU; CU may poll e2mgr.
  # Raise past the default 600s so ProgressDeadlineExceeded cannot race rollout.
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    type: {{ .Values.deploymentStrategy }}
  selector:
    matchLabels:
      app: ocudu-cu
  template:
    metadata:
      labels:
        app: ocudu-cu
      annotations:
        # Multus secondary networks: N2 (CU↔AMF), F1-C (CU↔DU), E2 (CU↔RIC)
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "{{ .Values.secondaryNetworks.n2.nadName }}",
              "namespace": "{{ .Values.namespace }}",
              "ips": ["{{ .Values.secondaryNetworks.n2.cuIP }}/24"]
            },
            {
              "name": "{{ .Values.secondaryNetworks.f1c.nadName }}",
              "namespace": "{{ .Values.namespace }}",
              "ips": ["{{ .Values.secondaryNetworks.f1c.cuIP }}/24"]
            },
            {
              "name": "{{ .Values.secondaryNetworks.e2.nadName }}",
              "namespace": "{{ .Values.namespace }}",
              "ips": ["{{ .Values.secondaryNetworks.e2.cuIP }}/24"]
            }
          ]
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      initContainers:
        {{ if .Values.e2Readiness.enabled }}
        - name: wait-for-e2t
          image: alpine:3.19
          env:
            - name: E2MGR_URL
              value: {{ .Values.e2Readiness.e2mgrUrl | quote }}
            - name: POLL_INTERVAL_SEC
              value: {{ .Values.e2Readiness.pollIntervalSec | quote }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for an E2T endpoint at ${E2MGR_URL}/v1/e2t/list..."
              until E2T_LIST="$(wget -qO- "${E2MGR_URL}/v1/e2t/list" 2>/dev/null)" \
                && echo "${E2T_LIST}" | grep -q '"e2tAddress"'; do
                echo "e2mgr is unavailable or has no E2T endpoint; retrying in ${POLL_INTERVAL_SEC}s..."
                sleep "${POLL_INTERVAL_SEC}"
              done
              echo "E2T endpoint ready: ${E2T_LIST}"
        {{ end }}
        - name: render-config
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              # Offline sed substitution — never apk add gettext (F9: Alpine
              # mirrors are unreachable on some clusters; silent apk failure
              # left literal ${VAR} placeholders and broke CU startup).
              set -eu
              : "${POD_IP:?}" "${N2_IP:?}" "${F1C_IP:?}" "${E2_IP:?}" "${AMF_IP:?}" "${E2TERM_IP:?}"
              sed \
                -e "s|\${POD_IP}|${POD_IP}|g" \
                -e "s|\${N2_IP}|${N2_IP}|g" \
                -e "s|\${F1C_IP}|${F1C_IP}|g" \
                -e "s|\${E2_IP}|${E2_IP}|g" \
                -e "s|\${AMF_IP}|${AMF_IP}|g" \
                -e "s|\${E2TERM_IP}|${E2TERM_IP}|g" \
                < /mnt/ocudu/templates/cu.yml.tpl > /mnt/ocudu/configs/cu.yml
              if grep -q '\${' /mnt/ocudu/configs/cu.yml; then
                echo "ERROR: unsubstituted placeholders remain in cu.yml:" >&2
                grep '\${' /mnt/ocudu/configs/cu.yml >&2
                exit 1
              fi
              echo "Rendered cu.yml: N2_IP=${N2_IP} F1C_IP=${F1C_IP} E2_IP=${E2_IP} POD_IP=${POD_IP}"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: N2_IP
              value: "{{ .Values.secondaryNetworks.n2.cuIP }}"
            - name: F1C_IP
              value: "{{ .Values.secondaryNetworks.f1c.cuIP }}"
            - name: E2_IP
              value: "{{ .Values.secondaryNetworks.e2.cuIP }}"
            - name: AMF_IP
              value: "{{ .Values.secondaryNetworks.n2.amfIP }}"
            - name: E2TERM_IP
              value: "{{ .Values.secondaryNetworks.e2.e2termIP }}"
          volumeMounts:
            - name: ocudu-templates
              mountPath: /mnt/ocudu/templates
              readOnly: true
            - name: ocudu-rendered
              mountPath: /mnt/ocudu/configs
      containers:
        - name: ocudu-cu
          image: {{ .Values.images.ocudu.repository }}:{{ .Values.images.ocudu.tag }}
          imagePullPolicy: {{ .Values.images.ocudu.pullPolicy }}
          command: ["/usr/local/bin/ocu", "-c", "/mnt/ocudu/configs/cu.yml"]
          securityContext:
            privileged: true
            capabilities:
              add: [NET_ADMIN, SYS_ADMIN, NET_RAW]
          ports:
            - containerPort: 38412
              name: n2-sctp
              protocol: SCTP
            - containerPort: 38472
              name: f1ap
              protocol: SCTP
            - containerPort: 2152
              name: ngu-gtpu
              protocol: UDP
            - containerPort: 2153
              name: f1u
              protocol: UDP
          volumeMounts:
            - name: ocudu-rendered
              mountPath: /mnt/ocudu/configs
              readOnly: true
            - name: ocudu-logs
              mountPath: /mnt/ocudu/logs
          stdin: true
          tty: true
          # CU exposes only SCTP/UDP — use process check (not tcpSocket).
          # `pgrep -x` alone; avoid `kill -0 $(pgrep …)` which misbehaves
          # when pgrep returns empty and flaps Available.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pgrep -x ocu >/dev/null"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -x ocu >/dev/null"]
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: ocudu-templates
          configMap:
            name: ocudu-configs
        - name: ocudu-rendered
          emptyDir: {}
        - name: ocudu-logs
          emptyDir: {}
---
# ClusterIP Service for CU — only used for F1-U (UDP) user-plane traffic.
# F1-C (SCTP) uses the static secondary IP directly, bypassing kube-proxy.
apiVersion: v1
kind: Service
metadata:
  name: ocudu-cu
  namespace: {{ .Values.namespace }}
  labels:
    app: ocudu-cu
spec:
  selector:
    app: ocudu-cu
  ports:
    - name: f1u
      port: 2153
      targetPort: 2153
      protocol: UDP
---
# --- DU (Distributed Unit) ---------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocudu-du
  namespace: {{ .Values.namespace }}
  labels:
    app: ocudu-du
    app.kubernetes.io/part-of: oran-stack
spec:
  replicas: 1
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    type: {{ .Values.deploymentStrategy }}
  selector:
    matchLabels:
      app: ocudu-du
  template:
    metadata:
      labels:
        app: ocudu-du
      annotations:
        # Multus secondary networks: F1-C (DU↔CU), E2 (DU↔RIC)
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "{{ .Values.secondaryNetworks.f1c.nadName }}",
              "namespace": "{{ .Values.namespace }}",
              "ips": ["{{ .Values.secondaryNetworks.f1c.duIP }}/24"]
            },
            {
              "name": "{{ .Values.secondaryNetworks.e2.nadName }}",
              "namespace": "{{ .Values.namespace }}",
              "ips": ["{{ .Values.secondaryNetworks.e2.duIP }}/24"]
            }
          ]
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      initContainers:
        - name: render-config
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              # Derive a unique gNB-DU-ID from the pod IP so that every new
              # pod gets a fresh DU ID, eliminating the "Duplicate DU ID"
              # F1SetupFailure that occurs when the CU still holds a stale
              # entry for the previous pod.
              #
              # Algorithm: treat the last two octets of POD_IP as a 16-bit
              # number (octet3*256 + octet4). This gives values 0–65535,
              # well within the gnb_du_id range of 0–68719476735.
              set -eu
              : "${POD_IP:?}" "${F1C_IP:?}" "${CU_F1C_IP:?}" "${E2_IP:?}" "${E2TERM_IP:?}"
              OCT3=$(echo "${POD_IP}" | cut -d. -f3)
              OCT4=$(echo "${POD_IP}" | cut -d. -f4)
              GNB_DU_ID=$(( OCT3 * 256 + OCT4 ))
              # Offline sed — same F9 rationale as the CU render-config.
              sed \
                -e "s|\${POD_IP}|${POD_IP}|g" \
                -e "s|\${GNB_DU_ID}|${GNB_DU_ID}|g" \
                -e "s|\${F1C_IP}|${F1C_IP}|g" \
                -e "s|\${CU_F1C_IP}|${CU_F1C_IP}|g" \
                -e "s|\${E2_IP}|${E2_IP}|g" \
                -e "s|\${E2TERM_IP}|${E2TERM_IP}|g" \
                < /mnt/ocudu/templates/du.yml.tpl > /mnt/ocudu/configs/du.yml
              if grep -q '\${' /mnt/ocudu/configs/du.yml; then
                echo "ERROR: unsubstituted placeholders remain in du.yml:" >&2
                grep '\${' /mnt/ocudu/configs/du.yml >&2
                exit 1
              fi
              echo "Rendered du.yml: POD_IP=${POD_IP} GNB_DU_ID=${GNB_DU_ID} F1C_IP=${F1C_IP}"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: F1C_IP
              value: "{{ .Values.secondaryNetworks.f1c.duIP }}"
            - name: CU_F1C_IP
              value: "{{ .Values.secondaryNetworks.f1c.cuIP }}"
            - name: E2_IP
              value: "{{ .Values.secondaryNetworks.e2.duIP }}"
            - name: E2TERM_IP
              value: "{{ .Values.secondaryNetworks.e2.e2termIP }}"
          volumeMounts:
            - name: ocudu-templates
              mountPath: /mnt/ocudu/templates
              readOnly: true
            - name: ocudu-rendered
              mountPath: /mnt/ocudu/configs
        - name: wait-for-cu
          image: alpine:3.19
          env:
            - name: HOLD_OFF_SEC
              value: "{{ .Values.duF1SetupHoldOffSec }}"
          command:
            - sh
            - -c
            - |
              # Step 1 — wait for the CU F1-U UDP port via the ClusterIP service.
              # F1-U binds to the primary pod IP (Flannel), not the F1-C secondary
              # IP; probing the static F1-C address would never succeed.
              # F1AP uses SCTP which alpine nc cannot probe; use the F1-U UDP
              # port as a proxy — the CU process opens both listeners together.
              # nc -zu sends a UDP probe and succeeds unless ICMP unreachable
              # is received (i.e., the port is closed).
              echo "Waiting for CU F1-U UDP port at ocudu-cu:2153..."
              until nc -zuw1 ocudu-cu 2153 2>/dev/null; do
                echo "waiting for CU F1-U UDP port 2153 at ocudu-cu..."
                sleep 3
              done
              echo "CU process is up."
              # Step 2 — P4 hold-off: the F1 setup retry count is hardcoded
              # to 1. If the DU sends F1SetupRequest while the CU still holds a
              # stale entry for a previous DU pod, the CU rejects with
              # "Duplicate DU ID" and the DU gives up permanently. The CU purges
              # stale entries ~23 s after SCTP COMM_LOST. We wait HOLD_OFF_SEC
              # (default: 30 s) after the CU is reachable to guarantee the cleanup
              # window has elapsed before the DU makes its single attempt.
              echo "Holding off ${HOLD_OFF_SEC}s for CU stale-state cleanup (P4)..."
              sleep "${HOLD_OFF_SEC}"
              echo "Hold-off complete — starting DU."
      containers:
        - name: ocudu-du
          image: {{ .Values.images.ocudu.repository }}:{{ .Values.images.ocudu.tag }}
          imagePullPolicy: {{ .Values.images.ocudu.pullPolicy }}
          command: ["/usr/local/bin/odu", "-c", "/mnt/ocudu/configs/du.yml"]
          securityContext:
            privileged: true
            capabilities:
              add: [NET_ADMIN, SYS_ADMIN, NET_RAW]
          ports:
            - containerPort: 2153
              name: f1u
              protocol: UDP
            - containerPort: 36421
              name: e2-sctp
              protocol: SCTP
            - containerPort: {{ .Values.zmq.duTxPort }}
              name: zmq-tx
              protocol: TCP
            - containerPort: {{ .Values.zmq.duRxPort }}
              name: zmq-rx
              protocol: TCP
          volumeMounts:
            - name: ocudu-rendered
              mountPath: /mnt/ocudu/configs
              readOnly: true
            - name: ocudu-logs
              mountPath: /mnt/ocudu/logs
          stdin: true
          tty: true
          # ZMQ stops accepting probe connections after the UE sidecar owns the
          # stream; probing the port kills an otherwise healthy DU. Check the
          # OCUDU process instead.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pgrep -x odu >/dev/null"]
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -x odu >/dev/null"]
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
{{- if .Values.deployUE }}
        # srsUE sidecar — must share the DU netns so ZMQ can use 127.0.0.1.
        # Cross-pod ZMQ via ClusterIP deadlocks after the TCP handshake.
        - name: srsue
          image: {{ .Values.images.srsue.repository }}:{{ .Values.images.srsue.tag }}
          imagePullPolicy: {{ .Values.images.srsue.pullPolicy }}
          command:
            - bash
            - -c
            - |
              set -e
              echo "waiting for local DU ZMQ on 127.0.0.1:{{ .Values.zmq.duTxPort }}..."
              until timeout 1 bash -c "echo >/dev/tcp/127.0.0.1/{{ .Values.zmq.duTxPort }}" 2>/dev/null; do
                sleep 2
              done
              echo "DU ZMQ up — waiting {{ .Values.ueStartDelaySec }}s for cell to activate..."
              sleep {{ .Values.ueStartDelaySec }}
              exec /usr/local/bin/srsue /mnt/srsran/configs/ue.conf
          securityContext:
            privileged: true
            capabilities:
              add: [NET_ADMIN, SYS_ADMIN, NET_RAW]
          volumeMounts:
            - name: ocudu-templates
              mountPath: /mnt/srsran/configs
              readOnly: true
            - name: srsue-logs
              mountPath: /mnt/srsran/logs
          stdin: true
          tty: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
{{- end }}
      volumes:
        - name: ocudu-templates
          configMap:
            name: ocudu-configs
        - name: ocudu-rendered
          emptyDir: {}
        - name: ocudu-logs
          emptyDir: {}
{{- if .Values.deployUE }}
        - name: srsue-logs
          emptyDir: {}
{{- end }}
---
# ClusterIP for DU (F1-U probe target for other charts; ZMQ is localhost-only).
apiVersion: v1
kind: Service
metadata:
  name: ocudu-du
  namespace: {{ .Values.namespace }}
  labels:
    app: ocudu-du
spec:
  selector:
    app: ocudu-du
  ports:
    - name: zmq-tx
      port: {{ .Values.zmq.duTxPort }}
      targetPort: {{ .Values.zmq.duTxPort }}
      protocol: TCP
    - name: zmq-rx
      port: {{ .Values.zmq.duRxPort }}
      targetPort: {{ .Values.zmq.duRxPort }}
      protocol: TCP
