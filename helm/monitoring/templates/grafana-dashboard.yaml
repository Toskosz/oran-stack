# ============================================================================
# Grafana Dashboard — O-RAN Stack Overview
# ============================================================================
# This ConfigMap is picked up by Grafana's sidecar (label: grafana_dashboard=1).
# It provides a single dashboard covering:
#   - Kubernetes pod health across all O-RAN namespaces
#   - Open5GS NF availability (AMF, SMF, UPF, PCF)
#   - Near-RT RIC E2 interface status (e2term, e2mgr)
#   - Node CPU and memory usage
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: oran-overview-dashboard
  namespace: {{ .Values.namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: oran-stack
data:
  oran-overview.json: |
    {
      "title": "O-RAN Stack Overview",
      "uid": "oran-overview",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "15s",
      "time": { "from": "now-30m", "to": "now" },
      "tags": ["oran", "5g", "ric"],
      "panels": [

        {
          "id": 1,
          "type": "stat",
          "title": "O-RAN Pod Health",
          "description": "Count of Running pods across 5g-core, near-rt-ric, ran, and ricxapp namespaces",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",   "value": null },
                  { "color": "yellow","value": 10 },
                  { "color": "green", "value": 14 }
                ]
              },
              "mappings": []
            }
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase=\"Running\", namespace=~\"5g-core|near-rt-ric|ran|ricxapp\"})",
              "legendFormat": "Running Pods",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 2,
          "type": "stat",
          "title": "AMF Up",
          "description": "1 = AMF container is running and serving SBI",
          "gridPos": { "x": 6, "y": 0, "w": 3, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",   "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } }
              ]
            }
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{deployment=\"amf\", namespace=\"5g-core\"}",
              "legendFormat": "AMF",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 3,
          "type": "stat",
          "title": "e2term Up",
          "description": "1 = e2term is running and its /metrics endpoint is reachable",
          "gridPos": { "x": 9, "y": 0, "w": 3, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",   "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } }
              ]
            }
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{deployment=\"ric-e2term\", namespace=\"near-rt-ric\"}",
              "legendFormat": "e2term",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 4,
          "type": "stat",
          "title": "ocudu-cu Up",
          "description": "1 = CU is running",
          "gridPos": { "x": 12, "y": 0, "w": 3, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",   "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } }
              ]
            }
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{deployment=\"ocudu-cu\", namespace=\"ran\"}",
              "legendFormat": "CU",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 5,
          "type": "stat",
          "title": "srsUE Up",
          "description": "1 = UE simulator is running",
          "gridPos": { "x": 15, "y": 0, "w": 3, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",   "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } }
              ]
            }
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{deployment=\"srsue\", namespace=\"ran\"}",
              "legendFormat": "UE",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 6,
          "type": "stat",
          "title": "KPM Indications/s",
          "description": "Rate of E2SM-KPM indications decoded and dispatched by each monitoring xApp",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0.01 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "rate(oran_xapp_kpm_indications_total[1m])",
              "legendFormat": "{{ "{{" }}service{{ "}}" }}",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 7,
          "type": "timeseries",
          "title": "UE Downlink Throughput — E2SM-KPM",
          "description": "DRB.UEThpDl decoded by the monitoring xApps. Generate traffic through tun_srsue to make this series rise.",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "Kbits",
              "min": 0,
              "custom": { "lineWidth": 3, "fillOpacity": 12, "spanNulls": false }
            }
          },
          "targets": [
            {
              "expr": "oran_kpm_drb_ue_throughput_dl_kbps",
              "legendFormat": "{{ "{{" }}service{{ "}}" }} / {{ "{{" }}e2_node{{ "}}" }} / {{ "{{" }}scope{{ "}}" }}",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 12,
          "type": "timeseries",
          "title": "UL Packet Success Rate — E2SM-KPM",
          "description": "DRB.PacketSuccessRateUlgNBUu is dimensionless (OCUDU/3GPP unit \"-\"): integer UL PDCP SDU success rate at the Uu interface, not kbps.",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "custom": { "lineWidth": 3, "fillOpacity": 12, "spanNulls": false }
            }
          },
          "targets": [
            {
              "expr": "oran_kpm_drb_packet_success_rate_ul",
              "legendFormat": "{{ "{{" }}service{{ "}}" }} / {{ "{{" }}e2_node{{ "}}" }} / {{ "{{" }}scope{{ "}}" }}",
              "refId": "A"
            },
            {
              "expr": "oran_kpm_mon_tmt_success_rate_average",
              "legendFormat": "kpm-mon-tmt moving average",
              "refId": "B"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 8,
          "type": "timeseries",
          "title": "kpm-load-watch — média móvel",
          "description": "Algoritmo da xApp nova: compara o KPI instantâneo com a média móvel de cinco amostras.",
          "gridPos": { "x": 0, "y": 12, "w": 16, "h": 6 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "Kbits",
              "min": 0,
              "custom": { "lineWidth": 3, "fillOpacity": 10, "spanNulls": false }
            }
          },
          "targets": [
            {
              "expr": "oran_kpm_drb_ue_throughput_dl_kbps{service=\"service-ricxapp-kpm-load-watch-http\"}",
              "legendFormat": "KPI instantâneo",
              "refId": "A"
            },
            {
              "expr": "oran_kpm_load_watch_average_kbps",
              "legendFormat": "média móvel",
              "refId": "B"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 9,
          "type": "stat",
          "title": "kpm-load-watch — estado",
          "description": "0=idle, 1=active, 2=busy, calculado pela média móvel da xApp.",
          "gridPos": { "x": 16, "y": 12, "w": 8, "h": 6 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              },
              "mappings": [
                { "type": "value", "options": {
                  "0": { "text": "IDLE" },
                  "1": { "text": "ACTIVE" },
                  "2": { "text": "BUSY" }
                }}
              ]
            }
          },
          "targets": [
            {
              "expr": "max(oran_kpm_load_watch_state{state=\"busy\"}) * 2 + max(oran_kpm_load_watch_state{state=\"active\"})",
              "legendFormat": "estado",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 10,
          "type": "timeseries",
          "title": "Pod Restarts — O-RAN Namespaces",
          "description": "Container restart count per pod. Restarts indicate crashes or SCTP failures.",
          "gridPos": { "x": 0, "y": 18, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "multi" } },
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 2 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow","value": 1 },
                  { "color": "red",   "value": 5 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"5g-core|near-rt-ric|ran|ricxapp\"}[5m])",
              "legendFormat": "{{ "{{" }}namespace{{ "}}" }}/{{ "{{" }}pod{{ "}}" }}/{{ "{{" }}container{{ "}}" }}",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 11,
          "type": "timeseries",
          "title": "Node CPU Usage",
          "description": "Per-node CPU utilisation. High CPU on the node hosting ocudu-cu/amf can cause SCTP RTO.",
          "gridPos": { "x": 12, "y": 18, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "multi" } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": { "lineWidth": 2 },
              "max": 1
            }
          },
          "targets": [
            {
              "expr": "1 - avg by(node)(rate(node_cpu_seconds_total{mode=\"idle\"}[2m]))",
              "legendFormat": "{{ "{{" }}node{{ "}}" }}",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },

        {
          "id": 20,
          "type": "table",
          "title": "O-RAN Deployment Status",
          "description": "Ready vs desired replicas for all O-RAN deployments",
          "gridPos": { "x": 0, "y": 26, "w": 24, "h": 8 },
          "options": { "sortBy": [{ "displayName": "Namespace", "desc": false }] },
          "fieldConfig": {
            "defaults": { "custom": { "align": "left" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Ready" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "red",   "value": null },
                        { "color": "green", "value": 1 }
                      ]
                    }
                  },
                  { "id": "custom.displayMode", "value": "color-background" }
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=~\"5g-core|near-rt-ric|ran|ricxapp\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            { "id": "organize", "options": {
              "renameByName": {
                "namespace": "Namespace",
                "deployment": "Deployment",
                "Value": "Ready"
              },
              "excludeByName": {
                "Time": true, "__name__": true, "job": true, "instance": true
              }
            }}
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        }
      ]
    }
